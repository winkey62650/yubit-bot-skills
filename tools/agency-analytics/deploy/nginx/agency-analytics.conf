limit_req_zone $binary_remote_addr zone=agency_events:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    client_max_body_size 128k;

    location = / {
        auth_basic off;
        return 302 https://152-32-161-174.sslip.io/distribution?view=site-analytics;
    }

    location = /tracker.js {
        auth_basic off;
        proxy_pass http://127.0.0.1:4180;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/events {
        auth_basic off;
        limit_req zone=agency_events burst=40 nodelay;
        proxy_pass http://127.0.0.1:4180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/health {
        auth_basic off;
        proxy_pass http://127.0.0.1:4180;
        proxy_set_header Host $host;
    }

    location / {
        auth_basic "Site Nerve";
        auth_basic_user_file /etc/agency-analytics/htpasswd;
        proxy_pass http://127.0.0.1:4180;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
