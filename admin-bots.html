<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>机器人配置</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{ops:{line:"#dbe4df",soft:"#edf4f0",accent:"#15956b",muted:"#63716b",ink:"#101815"}},boxShadow:{ops:"0 16px 40px rgba(28,49,40,.07)"}}}}</script>
<link rel="stylesheet" href="admin-polish.css"/>
</head>
<body class="bg-[#fbfcfb] text-ops-ink">
  <div class="min-h-screen lg:grid lg:grid-cols-[258px_minmax(0,1fr)]">
    <aside class="border-r border-ops-line bg-white p-6 lg:sticky lg:top-0 lg:h-screen lg:overflow-y-auto">
      <a class="mb-10 flex items-center gap-3" href="admin-group-config.html"><span class="grid h-9 w-9 place-items-center rounded-lg bg-ops-accent text-lg font-black text-white">Y</span><strong class="text-2xl">YUBIT</strong></a>
      <nav class="grid gap-2">
        <a class="rounded-lg hover:bg-ops-soft px-3 py-3 text-sm font-bold" href="admin-group-config.html">群配置</a>
        <a class="rounded-lg hover:bg-ops-soft px-3 py-3 text-sm font-bold" href="admin-new-group.html">新群初始化</a>
        <a class="rounded-lg hover:bg-ops-soft px-3 py-3 text-sm font-bold" href="admin-news.html">新闻配置</a>
        <a class="rounded-lg hover:bg-ops-soft px-3 py-3 text-sm font-bold" href="admin-signals.html">信号配置</a>
        <a class="rounded-lg hover:bg-ops-soft px-3 py-3 text-sm font-bold" href="admin-forward-broadcast.html">广播转发</a>
        <a class="rounded-lg hover:bg-ops-soft px-3 py-3 text-sm font-bold" href="admin-forward-social.html">代理社媒转发</a>
        <a class="rounded-lg bg-[#edf7f2] text-ops-accent px-3 py-3 text-sm font-bold" href="admin-bots.html">机器人配置</a>
        <a class="rounded-lg hover:bg-ops-soft px-3 py-3 text-sm font-bold" href="admin-groups.html">群数据</a>
        <a class="rounded-lg hover:bg-ops-soft px-3 py-3 text-sm font-bold" href="admin-settings.html">系统设置</a>
      </nav>
    </aside>
    <main class="p-8">
      <header class="mb-7 flex flex-col gap-4 xl:flex-row xl:items-center xl:justify-between">
        <div>
          <h1 class="text-3xl font-black">机器人配置</h1>
          <p class="mt-3 text-ops-muted">查看每个机器人接入了哪些群，以及它在运营系统里的职责。</p>
        </div>
        <button id="refreshBotGroupsBtn" class="min-h-10 rounded-lg border border-ops-accent px-5 text-sm font-black text-ops-accent">刷新机器人群</button>
      </header>

      <section class="mb-5 grid gap-0 overflow-hidden rounded-lg border border-ops-line bg-white shadow-ops md:grid-cols-4">
        <div class="border-b border-ops-line p-5 md:border-b-0 md:border-r"><div class="text-sm font-bold text-ops-muted">机器人</div><div id="botCount" class="mt-1 text-2xl font-black">5</div><div class="mt-1 text-xs text-ops-muted">已配置角色</div></div>
        <div class="border-b border-ops-line p-5 md:border-b-0 md:border-r"><div class="text-sm font-bold text-ops-muted">在线</div><div id="onlineBotCount" class="mt-1 text-2xl font-black">-</div><div class="mt-1 text-xs text-ops-muted">机器人连接正常</div></div>
        <div class="border-b border-ops-line p-5 md:border-b-0 md:border-r"><div class="text-sm font-bold text-ops-muted">覆盖群</div><div id="coveredGroupCount" class="mt-1 text-2xl font-black">-</div><div class="mt-1 text-xs text-ops-muted">最近可见的群</div></div>
        <div class="p-5"><div class="text-sm font-bold text-ops-muted">状态</div><div id="botRefreshStatus" class="mt-1 text-2xl font-black">待刷新</div><div class="mt-1 text-xs text-ops-muted">不显示 Token</div></div>
      </section>

      <section class="overflow-hidden rounded-lg border border-ops-line bg-white shadow-ops">
        <div class="border-b border-ops-line p-5"><h2 class="text-xl font-black">机器人所在群</h2></div>
        <div class="overflow-x-auto">
          <table class="w-full min-w-[1080px] text-sm">
            <thead class="bg-[#f9fbfa] text-left text-xs uppercase text-ops-muted">
              <tr><th class="px-5 py-3">机器人</th><th class="px-5 py-3">机器人账号</th><th class="px-5 py-3">职责</th><th class="px-5 py-3">所在群</th><th class="px-5 py-3">状态</th></tr>
            </thead>
            <tbody id="botGroupRows"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
  <script>
    const fallbackBots = [
      { name: "YUBITadmin", username: "YUBITADMINBOT", role: "群管理 / 建群 / 公告", status: "待刷新", groups: [] },
      { name: "Trader1", username: "YUBITTRADER1BOT", role: "新闻 / 信号推送", status: "待刷新", groups: [] },
      { name: "MOD1", username: "YUBITMOD1BOT", role: "人工管理辅助", status: "待刷新", groups: [] },
      { name: "Jack", username: "yubittest1bot", role: "市场讨论", status: "待刷新", groups: [] },
      { name: "Tony", username: "YUBitchat1bot", role: "风险讨论", status: "待刷新", groups: [] }
    ];

    function renderBots(bots) {
      const rows = document.getElementById("botGroupRows");
      const allGroupIds = new Set();
      let onlineCount = 0;
      rows.innerHTML = bots.map((bot) => {
        if (bot.status === "在线") onlineCount += 1;
        (bot.groups || []).forEach((group) => allGroupIds.add(String(group.id)));
        const groups = (bot.groups || []).length
          ? bot.groups.map((group) => `<span class="mr-2 mb-2 inline-block rounded-lg bg-[#edf7f2] px-2 py-1 text-xs font-black text-ops-accent">${group.title}</span>`).join("")
          : '<span class="text-ops-muted">暂无可见群</span>';
        const tone = bot.status === "在线" ? "bg-[#e6f7ef] text-ops-accent" : bot.status === "未配置" ? "bg-[#f5f7f6] text-ops-muted" : "bg-[#fff4df] text-[#c98118]";
        return `<tr class="border-t border-ops-line align-top">
          <td class="px-5 py-4"><b>${bot.name}</b></td>
          <td class="px-5 py-4"><span class="internal-id">${escapeHtml(formatUsername(bot.username))}</span></td>
          <td class="px-5 py-4">${bot.role}</td>
          <td class="px-5 py-4">${groups}</td>
          <td class="px-5 py-4"><span class="rounded-full ${tone} px-2 py-1 text-xs font-black">${bot.status}</span></td>
        </tr>`;
      }).join("");
      document.getElementById("botCount").textContent = String(bots.length);
      document.getElementById("onlineBotCount").textContent = String(onlineCount);
      document.getElementById("coveredGroupCount").textContent = String(allGroupIds.size);
    }

    function escapeHtml(value) {
      return String(value || "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
    }

    function formatUsername(value) {
      const name = String(value || "").trim();
      return name ? `@${name.replace(/^@/, "")}` : "待刷新";
    }

    async function refreshBotGroups() {
      const button = document.getElementById("refreshBotGroupsBtn");
      const status = document.getElementById("botRefreshStatus");
      if (button.disabled) return;
      button.disabled = true;
      button.textContent = "刷新中...";
      status.textContent = "读取中";
      try {
        const response = await fetch("/api/bot-groups");
        const data = await response.json();
        renderBots(data.bots || fallbackBots);
        status.textContent = "已刷新";
      } catch (error) {
        status.textContent = "失败";
      } finally {
        button.disabled = false;
        button.textContent = "刷新机器人群";
      }
    }

    renderBots(fallbackBots);
    document.getElementById("refreshBotGroupsBtn").addEventListener("click", refreshBotGroups);
    refreshBotGroups();
  </script>
</body>
</html>
