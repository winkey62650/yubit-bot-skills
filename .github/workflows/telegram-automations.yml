name: Telegram automations

on:
  schedule:
    # Vercel Hobby only supports daily Cron Jobs. The shared distribution
    # scheduler runs here every five minutes and remains protected by the
    # same server-side CRON_SECRET used by the API route. Start at minute 2
    # to avoid GitHub Actions' busiest start-of-hour scheduling window.
    - cron: "2/5 * * * *"
  workflow_dispatch:
    inputs:
      job:
        description: Automation to run
        required: true
        type: choice
        options:
          - agents
          - distribution
          - trading

concurrency:
  group: telegram-automation-${{ github.event.schedule || inputs.job }}
  cancel-in-progress: false

jobs:
  distribution:
    if: github.event_name == 'schedule' || inputs.job == 'distribution'
    runs-on: ubuntu-latest
    steps:
      - name: Run content distribution scheduler
        run: >-
          curl --fail-with-body --retry 2 --retry-all-errors --max-time 90
          -H "Authorization: Bearer $YUBIT_CRON_SECRET"
          "$APP_BASE_URL/api/cron/distribution"
        env:
          APP_BASE_URL: https://yubit-bot-skills-academy.vercel.app
          YUBIT_CRON_SECRET: ${{ secrets.YUBIT_CRON_SECRET }}

  trading:
    if: github.event_name == 'schedule' || inputs.job == 'trading'
    runs-on: ubuntu-latest
    steps:
      - name: Reconcile verified YUBIT orders
        run: >-
          curl --fail-with-body --retry 2 --retry-all-errors --max-time 90
          -H "Authorization: Bearer $YUBIT_CRON_SECRET"
          "$APP_BASE_URL/api/cron/trading-reconcile"
        env:
          APP_BASE_URL: https://yubit-bot-skills-academy.vercel.app
          YUBIT_CRON_SECRET: ${{ secrets.YUBIT_CRON_SECRET }}

  agents:
    if: inputs.job == 'agents'
    runs-on: ubuntu-latest
    steps:
      - name: Run agent information crawl
        run: >-
          curl --fail-with-body --retry 2 --max-time 90
          -H "Authorization: Bearer $YUBIT_CRON_SECRET"
          "$APP_BASE_URL/api/cron/agents"
        env:
          APP_BASE_URL: https://yubit-bot-skills-academy.vercel.app
          YUBIT_CRON_SECRET: ${{ secrets.YUBIT_CRON_SECRET }}
