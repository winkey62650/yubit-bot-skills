  distribution:
    if: inputs.job == 'distribution'
    runs-on: ubuntu-latest
    steps:
      - name: Run content distribution scheduler
        run: |
          if [ -z "$YUBIT_CRON_SECRET" ]; then
            echo "YUBIT_CRON_SECRET is missing; configure the same non-empty value as the production server CRON_SECRET." >&2
            exit 1
          fi
          # Drain at most three due jobs during an operator-triggered recovery.
          for attempt in 1 2 3; do
            response=$(curl --fail-with-body --max-time 55 \
              -H "Authorization: Bearer $YUBIT_CRON_SECRET" \
              "$APP_BASE_URL/api/cron/distribution")
            echo "$response"
            claimed=$(printf '%s' "$response" | jq -r '.claimed // 0')
            if [ "$claimed" = "0" ]; then
              break
            fi
          done
        env:
          APP_BASE_URL: https://152-32-161-174.sslip.io
          YUBIT_CRON_SECRET: ${{ secrets.YUBIT_CRON_SECRET }}

  trading:
    if: inputs.job == 'trading'
    runs-on: ubuntu-latest
    steps:
      - name: Reconcile verified YUBIT orders
        run: |
          if [ -z "$YUBIT_CRON_SECRET" ]; then
            echo "YUBIT_CRON_SECRET is missing; configure the same non-empty value as the production server CRON_SECRET." >&2
            exit 1
          fi
          curl --fail-with-body --retry 2 --retry-all-errors --max-time 90 \
            -H "Authorization: Bearer $YUBIT_CRON_SECRET" \
            "$APP_BASE_URL/api/cron/trading-reconcile"
        env:
          APP_BASE_URL: https://152-32-161-174.sslip.io
          YUBIT_CRON_SECRET: ${{ secrets.YUBIT_CRON_SECRET }}

  agents:
    if: inputs.job == 'agents'
    runs-on: ubuntu-latest
    steps:
      - name: Run agent information crawl
        run: |
          if [ -z "$YUBIT_CRON_SECRET" ]; then
            echo "YUBIT_CRON_SECRET is missing; configure the same non-empty value as the production server CRON_SECRET." >&2
            exit 1
          fi
          curl --fail-with-body --retry 2 --max-time 90 \
            -H "Authorization: Bearer $YUBIT_CRON_SECRET" \
            "$APP_BASE_URL/api/cron/agents"
        env:
          APP_BASE_URL: https://152-32-161-174.sslip.io
          YUBIT_CRON_SECRET: ${{ secrets.YUBIT_CRON_SECRET }}
