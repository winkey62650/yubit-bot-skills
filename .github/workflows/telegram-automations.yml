name: Telegram automations

on:
  # The independent production server owns all recurring schedules. Keep
  # these jobs only as an operator-triggered recovery path.
  workflow_dispatch:
    inputs:
      job:
        description: Automation to run
        required: true
        type: choice
        options:
          - academy-realtime-demo
          - academy-demo
          - academy-release-recovery
          - academy-audit
          - agents
          - distribution
          - trading

concurrency:
  group: telegram-automation-${{ inputs.job }}
  cancel-in-progress: false

jobs:
  academy_realtime_demo:
    if: inputs.job == 'academy-realtime-demo'
    runs-on: ubuntu-latest
    environment: Production
    env:
      TEST_BASE_URL: https://152-32-161-174.sslip.io
    steps:
      - name: Install SSH password helper
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sshpass

      - name: Send only currently eligible realtime text products to Academy DEMO
        env:
          SSHPASS: ${{ secrets.YUBIT_SERVER_PASSWORD }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          if [ -z "$SSHPASS" ]; then
            echo "YUBIT_SERVER_PASSWORD is not configured." >&2
            exit 1
          fi
          report_path="$RUNNER_TEMP/academy-realtime-demo.json"
          sshpass -e ssh \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=10 \
            -o StrictHostKeyChecking=accept-new \
            ubuntu@152.32.161.174 \
            "EXPECTED_SHA='$EXPECTED_SHA' TEST_BASE_URL='$TEST_BASE_URL' bash -s" \
            >"$report_path" <<'REMOTE'
          set -Eeuo pipefail
          env_file=/etc/yubit-academy/production.env
          expected_targets='-1003710405969:8,-1003710405969:10,-1003710405969:16'
          report_file="$(sudo --user=ubuntu mktemp)"
          cleanup() { rm -f "$report_file"; }
          trap cleanup EXIT

          release="$(readlink -f /opt/yubit-academy/current)"
          case "$release" in
            /opt/yubit-academy/releases/*) ;;
            *) echo "Current release path is invalid." >&2; exit 1 ;;
          esac
          current_sha="$(tr -d '[:space:]' <"$release/.release-commit")"
          if [ "$current_sha" != "$EXPECTED_SHA" ]; then
            echo "The requested workflow SHA is not the deployed release." >&2
            exit 1
          fi

          read_env() {
            sudo awk -F= -v key="$1" '$1 == key { sub(/^[^=]*=/, ""); print; exit }' "$env_file"
          }
          auth_username="$(read_env AUTH_USERNAME)"
          auth_password="$(read_env AUTH_PASSWORD)"
          obsidian_vault_path="$(read_env OBSIDIAN_VAULT_PATH)"
          if [ -z "$auth_username" ] || [ -z "$auth_password" ] || [ -z "$obsidian_vault_path" ]; then
            echo "Production application credentials or Obsidian vault are unavailable." >&2
            exit 1
          fi
          if [ "$(read_env TELEGRAM_DEMO_ONLY)" != "true" ] \
            || [ "$(read_env TRADING_DEMO_ONLY)" != "true" ] \
            || [ "$(read_env TELEGRAM_DISTRIBUTION_APPROVED_TARGETS)" != "$expected_targets" ] \
            || [ "$(read_env ALLOW_LIVE_TELEGRAM)" != "false" ]; then
            echo "Production Telegram safety policy is not locked." >&2
            exit 1
          fi
          publisher_config_before="$(sudo grep -E '^(TELEGRAM_[^=]*|DISCORD_[^=]*|TRADING_DEMO_ONLY|ALLOW_LIVE_TELEGRAM)=' "$env_file" | sha256sum | awk '{print $1}')"

          set +e
          sudo --user=ubuntu env \
            RELEASE_STAGE=production \
            ALLOW_LIVE_TELEGRAM=true \
            TEST_BASE_URL="$TEST_BASE_URL" \
            TEST_USERNAME="$auth_username" \
            TEST_PASSWORD="$auth_password" \
            OBSIDIAN_VAULT_PATH="$obsidian_vault_path" \
            TEST_REPORT_PATH="$report_file" \
            ACCEPTANCE_QUIET=true \
            /opt/yubit-node/bin/node "$release/scripts/send-academy-realtime-demo.cjs"
          script_status=$?
          set -e

          publisher_config_after="$(sudo grep -E '^(TELEGRAM_[^=]*|DISCORD_[^=]*|TRADING_DEMO_ONLY|ALLOW_LIVE_TELEGRAM)=' "$env_file" | sha256sum | awk '{print $1}')"
          if [ "$publisher_config_after" != "$publisher_config_before" ] \
            || [ "$(read_env ALLOW_LIVE_TELEGRAM)" != "false" ]; then
            echo "Realtime DEMO send changed persistent publisher safety configuration." >&2
            exit 1
          fi
          cat "$report_file"
          exit "$script_status"
          REMOTE
          jq -e '
            .ok == true
            and .operation == "academy-realtime-demo-text-delivery"
            and .historicalReplay == false
            and .mediaIncluded == false
            and .exactTargets == true
            and (.results | length == 3)
            and all(.results[]; .status == "sent" or .status == "skipped")
            and all(.results[] | select(.status == "sent"); .target.chatId == "-1003710405969" and (.target.threadId == 8 or .target.threadId == 10) and (.messageIds | length > 0))
            and all(.cleanup[]; .deleted == true)
          ' "$report_path" >/dev/null
          echo "### Academy DEMO realtime text delivery" >>"$GITHUB_STEP_SUMMARY"
          jq -r '"- Release: `\(.release.commitSha)`\n- Sent: `\(.results | map(select(.status == "sent") | .productTypes | join(" + ")) | join(", "))`\n- Skipped: `\(.results | map(select(.status == "skipped") | (.key + " (" + (.skipReason // "unspecified") + ")")) | join(", "))`\n- Media included: `\(.mediaIncluded)`"' "$report_path" >>"$GITHUB_STEP_SUMMARY"

      - name: Upload Academy DEMO realtime delivery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academy-realtime-demo-${{ github.sha }}
          path: ${{ runner.temp }}/academy-realtime-demo.json
          if-no-files-found: error
          retention-days: 30

  academy_audit:
    if: inputs.job == 'academy-audit'
    runs-on: ubuntu-latest
    environment: Production
    env:
      TEST_BASE_URL: https://152-32-161-174.sslip.io
    steps:
      - name: Install SSH password helper
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sshpass

      - name: Read Academy DEMO delivery receipts without sending
        env:
          SSHPASS: ${{ secrets.YUBIT_SERVER_PASSWORD }}
        run: |
          set -Eeuo pipefail
          report_path="$RUNNER_TEMP/academy-demo-audit.json"
          sshpass -e ssh \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=10 \
            -o StrictHostKeyChecking=accept-new \
            ubuntu@152.32.161.174 \
            "TEST_BASE_URL='$TEST_BASE_URL' bash -s" \
            >"$report_path" <<'REMOTE'
          set -Eeuo pipefail
          env_file=/etc/yubit-academy/production.env
          read_env() {
            sudo awk -F= -v key="$1" '$1 == key { sub(/^[^=]*=/, ""); print; exit }' "$env_file"
          }
          release="$(readlink -f /opt/yubit-academy/current)"
          export AUTH_USERNAME="$(read_env AUTH_USERNAME)"
          export AUTH_PASSWORD="$(read_env AUTH_PASSWORD)"
          export OBSIDIAN_VAULT_PATH="$(read_env OBSIDIAN_VAULT_PATH)"
          export RELEASE_SHA="$(tr -d '[:space:]' <"$release/.release-commit")"
          python3 <<'PYTHON'
          import datetime
          import glob
          import http.cookiejar
          import json
          import os
          import re
          import ssl
          import urllib.request

          base_url = os.environ["TEST_BASE_URL"]
          cookie_jar = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(
              urllib.request.HTTPCookieProcessor(cookie_jar),
              urllib.request.HTTPSHandler(context=ssl._create_unverified_context()),
          )

          def read_json(request):
              with opener.open(request, timeout=30) as response:
                  return json.load(response)

          login_request = urllib.request.Request(
              f"{base_url}/api/auth/login",
              data=json.dumps({
                  "username": os.environ["AUTH_USERNAME"],
                  "password": os.environ["AUTH_PASSWORD"],
              }).encode(),
              headers={"content-type": "application/json"},
              method="POST",
          )
          login = read_json(login_request)
          if login.get("ok") is not True:
              raise RuntimeError("login was not accepted")
          deliveries = read_json(f"{base_url}/api/distribution/logs?limit=500")
          overview = read_json(f"{base_url}/api/distribution")
          demo_rule = re.compile(r"^academy-demo-showcase-(daily|weekly|release)(?:-recovery-[a-z0-9-]+)?-temporary$")
          receipt_fields = [
              "id", "ruleId", "status", "target", "targetMessageId", "targetMessageIds",
              "deliveredAt", "createdAt", "updatedAt", "error",
          ]

          def canonical_payload(path):
              with open(path, encoding="utf-8") as note:
                  markdown = note.read()
              marker = "<!-- yubit-canonical-payload:v1 -->\n\n```json\n"
              start = markdown.rfind(marker)
              if start < 0 or not markdown.endswith("\n```\n"):
                  return None
              return json.loads(markdown[start + len(marker):-5])

          receipt_payloads = []
          distribution_dir = os.path.join(os.environ["OBSIDIAN_VAULT_PATH"], "40 Distribution")
          for path in glob.glob(os.path.join(distribution_dir, "*.md")):
              if os.path.basename(path) == "INDEX.md":
                  continue
              payload = canonical_payload(path)
              if payload and demo_rule.match(payload.get("ruleId", "")):
                  receipt_payloads.append(payload)
          report = {
              "ok": True,
              "readOnly": True,
              "releaseSha": os.environ["RELEASE_SHA"],
              "auditedAt": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "deliveries": [
                  {field: item.get(field) for field in receipt_fields}
                  for item in deliveries.get("items", [])
                  if demo_rule.match(item.get("ruleId", ""))
              ],
              "obsidianReceipts": sorted(receipt_payloads, key=lambda item: item.get("occurredAt", "")),
              "temporaryRules": [
                  {field: rule.get(field) for field in ("id", "enabled", "status")}
                  for rule in overview.get("rules", [])
                  if demo_rule.match(rule.get("id", ""))
              ],
          }
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PYTHON
          REMOTE
          jq -e '.ok == true and .readOnly == true' "$report_path" >/dev/null

      - name: Upload Academy DEMO read-only audit
        uses: actions/upload-artifact@v4
        with:
          name: academy-demo-audit-${{ github.sha }}
          path: ${{ runner.temp }}/academy-demo-audit.json
          if-no-files-found: error
          retention-days: 30

  academy_demo:
    if: inputs.job == 'academy-demo'
    runs-on: ubuntu-latest
    environment: Production
    env:
      TEST_BASE_URL: https://152-32-161-174.sslip.io
    steps:
      - name: Install SSH password helper
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sshpass

      - name: Send all four governed text products to approved Academy DEMO topics
        env:
          SSHPASS: ${{ secrets.YUBIT_SERVER_PASSWORD }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          if [ -z "$SSHPASS" ]; then
            echo "YUBIT_SERVER_PASSWORD is not configured." >&2
            exit 1
          fi
          report_path="$RUNNER_TEMP/academy-demo-acceptance.json"
          sshpass -e ssh \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=10 \
            -o StrictHostKeyChecking=accept-new \
            ubuntu@152.32.161.174 \
            "EXPECTED_SHA='$EXPECTED_SHA' TEST_BASE_URL='$TEST_BASE_URL' bash -s" \
            >"$report_path" <<'REMOTE'
          set -Eeuo pipefail
          env_file=/etc/yubit-academy/production.env
          expected_targets='-1003710405969:8,-1003710405969:10,-1003710405969:16'
          report_file="$(sudo --user=ubuntu mktemp)"
          cleanup() { rm -f "$report_file"; }
          trap cleanup EXIT

          release="$(readlink -f /opt/yubit-academy/current)"
          case "$release" in
            /opt/yubit-academy/releases/*) ;;
            *) echo "Current release path is invalid." >&2; exit 1 ;;
          esac
          current_sha="$(tr -d '[:space:]' <"$release/.release-commit")"
          if [ "$current_sha" != "$EXPECTED_SHA" ]; then
            echo "The requested workflow SHA is not the deployed release." >&2
            exit 1
          fi

          read_env() {
            sudo awk -F= -v key="$1" '$1 == key { sub(/^[^=]*=/, ""); print; exit }' "$env_file"
          }
          auth_username="$(read_env AUTH_USERNAME)"
          auth_password="$(read_env AUTH_PASSWORD)"
          if [ -z "$auth_username" ] || [ -z "$auth_password" ]; then
            echo "Production application credentials are unavailable." >&2
            exit 1
          fi
          if [ "$(read_env TELEGRAM_DEMO_ONLY)" != "true" ] \
            || [ "$(read_env TELEGRAM_DISTRIBUTION_APPROVED_TARGETS)" != "$expected_targets" ] \
            || [ "$(read_env ALLOW_LIVE_TELEGRAM)" != "false" ]; then
            echo "Production Telegram safety policy is not locked." >&2
            exit 1
          fi
          publisher_config_before="$(sudo grep -E '^(TELEGRAM_[^=]*|DISCORD_[^=]*|TRADING_DEMO_ONLY|ALLOW_LIVE_TELEGRAM)=' "$env_file" | sha256sum | awk '{print $1}')"

          sudo --user=ubuntu env \
            RELEASE_STAGE=production \
            ALLOW_LIVE_TELEGRAM=true \
            TEST_BASE_URL="$TEST_BASE_URL" \
            TEST_USERNAME="$auth_username" \
            TEST_PASSWORD="$auth_password" \
            TEST_REPORT_PATH="$report_file" \
            ACCEPTANCE_QUIET=true \
            /opt/yubit-node/bin/node "$release/scripts/accept-academy-demo-content.cjs"

          publisher_config_after="$(sudo grep -E '^(TELEGRAM_[^=]*|DISCORD_[^=]*|TRADING_DEMO_ONLY|ALLOW_LIVE_TELEGRAM)=' "$env_file" | sha256sum | awk '{print $1}')"
          if [ "$publisher_config_after" != "$publisher_config_before" ] \
            || [ "$(read_env ALLOW_LIVE_TELEGRAM)" != "false" ]; then
            echo "DEMO acceptance changed persistent publisher safety configuration." >&2
            exit 1
          fi
          cat "$report_file"
          REMOTE
          jq -e '.ok == true and .historicalReplay == true and .mediaIncluded == false and (.products | length == 4) and (.executions | length == 3) and all(.targets[]; .chatId == "-1003710405969" and (.threadId == 8 or .threadId == 10))' "$report_path" >/dev/null
          echo "### Academy DEMO four-product text acceptance" >>"$GITHUB_STEP_SUMMARY"
          jq -r '"- Release: `\(.release.commitSha)`\n- Products: `\(.products | map(.product) | join(", "))`\n- Telegram messages: `\(.executions | map(.messageIds | join(",")) | join(" · "))`\n- Media included: `\(.mediaIncluded)`"' "$report_path" >>"$GITHUB_STEP_SUMMARY"

      - name: Upload Academy DEMO acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: academy-demo-acceptance-${{ github.sha }}
          path: ${{ runner.temp }}/academy-demo-acceptance.json
          if-no-files-found: error
          retention-days: 30

  academy_release_recovery:
    if: inputs.job == 'academy-release-recovery'
    runs-on: ubuntu-latest
    environment: Production
    env:
      TEST_BASE_URL: https://152-32-161-174.sslip.io
    steps:
      - name: Install SSH password helper
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sshpass

      - name: Send only the two missing governed text products to Academy DEMO Topic 8
        env:
          SSHPASS: ${{ secrets.YUBIT_SERVER_PASSWORD }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          if [ -z "$SSHPASS" ]; then
            echo "YUBIT_SERVER_PASSWORD is not configured." >&2
            exit 1
          fi
          report_path="$RUNNER_TEMP/academy-demo-four-product-acceptance.json"
          sshpass -e ssh \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=10 \
            -o StrictHostKeyChecking=accept-new \
            ubuntu@152.32.161.174 \
            "EXPECTED_SHA='$EXPECTED_SHA' TEST_BASE_URL='$TEST_BASE_URL' bash -s" \
            >"$report_path" <<'REMOTE'
          set -Eeuo pipefail
          env_file=/etc/yubit-academy/production.env
          expected_targets='-1003710405969:8,-1003710405969:10,-1003710405969:16'
          report_file="$(sudo --user=ubuntu mktemp)"
          cleanup() { rm -f "$report_file"; }
          trap cleanup EXIT

          release="$(readlink -f /opt/yubit-academy/current)"
          case "$release" in
            /opt/yubit-academy/releases/*) ;;
            *) echo "Current release path is invalid." >&2; exit 1 ;;
          esac
          current_sha="$(tr -d '[:space:]' <"$release/.release-commit")"
          if [ "$current_sha" != "$EXPECTED_SHA" ]; then
            echo "The requested workflow SHA is not the deployed release." >&2
            exit 1
          fi

          read_env() {
            sudo awk -F= -v key="$1" '$1 == key { sub(/^[^=]*=/, ""); print; exit }' "$env_file"
          }
          auth_username="$(read_env AUTH_USERNAME)"
          auth_password="$(read_env AUTH_PASSWORD)"
          obsidian_vault_path="$(read_env OBSIDIAN_VAULT_PATH)"
          if [ -z "$auth_username" ] || [ -z "$auth_password" ] || [ -z "$obsidian_vault_path" ]; then
            echo "Production application credentials or Obsidian vault are unavailable." >&2
            exit 1
          fi
          if [ "$(read_env TELEGRAM_DEMO_ONLY)" != "true" ] \
            || [ "$(read_env TRADING_DEMO_ONLY)" != "true" ] \
            || [ "$(read_env TELEGRAM_DISTRIBUTION_APPROVED_TARGETS)" != "$expected_targets" ] \
            || [ "$(read_env ALLOW_LIVE_TELEGRAM)" != "false" ]; then
            echo "Production Telegram safety policy is not locked." >&2
            exit 1
          fi
          publisher_config_before="$(sudo grep -E '^(TELEGRAM_[^=]*|DISCORD_[^=]*|TRADING_DEMO_ONLY|ALLOW_LIVE_TELEGRAM)=' "$env_file" | sha256sum | awk '{print $1}')"

          sudo --user=ubuntu env \
            RELEASE_STAGE=production \
            ALLOW_LIVE_TELEGRAM=true \
            TEST_BASE_URL="$TEST_BASE_URL" \
            TEST_USERNAME="$auth_username" \
            TEST_PASSWORD="$auth_password" \
            OBSIDIAN_VAULT_PATH="$obsidian_vault_path" \
            TEST_REPORT_PATH="$report_file" \
            ACCEPTANCE_QUIET=true \
            /opt/yubit-node/bin/node "$release/scripts/recover-academy-demo-release.cjs"

          publisher_config_after="$(sudo grep -E '^(TELEGRAM_[^=]*|DISCORD_[^=]*|TRADING_DEMO_ONLY|ALLOW_LIVE_TELEGRAM)=' "$env_file" | sha256sum | awk '{print $1}')"
          if [ "$publisher_config_after" != "$publisher_config_before" ] \
            || [ "$(read_env ALLOW_LIVE_TELEGRAM)" != "false" ]; then
            echo "DEMO recovery changed persistent publisher safety configuration." >&2
            exit 1
          fi
          cat "$report_file"
          REMOTE
          jq -e '
            .ok == true
            and .operation == "academy-demo-release-only-recovery"
            and .historicalReplay == true
            and .mediaIncluded == false
            and .exactTargets == true
            and (.priorExecutions | length == 2)
            and (.priorExecutions[0].key == "daily" and .priorExecutions[0].messageIds == [1290] and .priorExecutions[0].target.threadId == 10)
            and (.priorExecutions[1].key == "weekly" and .priorExecutions[1].messageIds == [1291] and .priorExecutions[1].target.threadId == 8)
            and (.recoveryExecution.productTypes == ["data-flash", "market-follow-up"])
            and (.recoveryExecution.messageIds | length == 2)
            and (.recoveryExecution.target.chatId == "-1003710405969" and .recoveryExecution.target.threadId == 8)
            and (.products | map(.product) == ["daily-market-brief", "weekly-catalyst-calendar", "data-flash", "market-follow-up"])
            and (.cleanup == [{"id":"academy-demo-showcase-release-recovery-20260823-v2-temporary","deleted":true}])
          ' "$report_path" >/dev/null
          echo "### Academy DEMO four-product text acceptance completed" >>"$GITHUB_STEP_SUMMARY"
          jq -r '"- Prior messages: `\(.priorExecutions | map(.messageIds | join(",")) | join(" · "))`\n- Recovered messages: `\(.recoveryExecution.messageIds | join(","))`\n- Products: `\(.products | map(.product) | join(", "))`\n- Media included: `\(.mediaIncluded)`"' "$report_path" >>"$GITHUB_STEP_SUMMARY"

      - name: Upload complete Academy DEMO acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: academy-demo-four-product-acceptance-${{ github.sha }}
          path: ${{ runner.temp }}/academy-demo-four-product-acceptance.json
          if-no-files-found: error
          retention-days: 30

  distribution:
    if: inputs.job == 'distribution'
    runs-on: ubuntu-latest
    steps:
      - name: Run content distribution scheduler
        run: |
          if [ -z "$YUBIT_CRON_SECRET" ]; then
            echo "YUBIT_CRON_SECRET is missing; configure the same non-empty value as the production server CRON_SECRET." >&2
            exit 1
          fi
          # Drain at most three due jobs during an operator-triggered recovery.
          for attempt in 1 2 3; do
            response=$(curl --fail-with-body --max-time 55 \
              -H "Authorization: Bearer $YUBIT_CRON_SECRET" \
              "$APP_BASE_URL/api/cron/distribution")
            echo "$response"
            claimed=$(printf '%s' "$response" | jq -r '.claimed // 0')
            if [ "$claimed" = "0" ]; then
              break
            fi
          done
        env:
          APP_BASE_URL: https://152-32-161-174.sslip.io
          YUBIT_CRON_SECRET: ${{ secrets.YUBIT_CRON_SECRET }}

  trading:
    if: inputs.job == 'trading'
    runs-on: ubuntu-latest
    steps:
      - name: Reconcile verified YUBIT orders
        run: |
          if [ -z "$YUBIT_CRON_SECRET" ]; then
            echo "YUBIT_CRON_SECRET is missing; configure the same non-empty value as the production server CRON_SECRET." >&2
            exit 1
          fi
          curl --fail-with-body --retry 2 --retry-all-errors --max-time 90 \
            -H "Authorization: Bearer $YUBIT_CRON_SECRET" \
            "$APP_BASE_URL/api/cron/trading-reconcile"
        env:
          APP_BASE_URL: https://152-32-161-174.sslip.io
          YUBIT_CRON_SECRET: ${{ secrets.YUBIT_CRON_SECRET }}

  agents:
    if: inputs.job == 'agents'
    runs-on: ubuntu-latest
    steps:
      - name: Run agent information crawl
        run: |
          if [ -z "$YUBIT_CRON_SECRET" ]; then
            echo "YUBIT_CRON_SECRET is missing; configure the same non-empty value as the production server CRON_SECRET." >&2
            exit 1
          fi
          curl --fail-with-body --retry 2 --max-time 90 \
            -H "Authorization: Bearer $YUBIT_CRON_SECRET" \
            "$APP_BASE_URL/api/cron/agents"
        env:
          APP_BASE_URL: https://152-32-161-174.sslip.io
          YUBIT_CRON_SECRET: ${{ secrets.YUBIT_CRON_SECRET }}
