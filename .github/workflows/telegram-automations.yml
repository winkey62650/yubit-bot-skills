name: Telegram automations

on:
  # The independent production server owns all recurring schedules. Keep
  # these jobs only as an operator-triggered recovery path.
  workflow_dispatch:
    inputs:
      job:
        description: Automation to run
        required: true
        type: choice
        options:
          - academy-realtime-demo
          - academy-demo
          - academy-poster-v6-recovery
          - academy-audit
          - telegram-house-audit
          - discord-audit
          - discord-demo
          - agents
          - distribution
          - trading

concurrency:
  group: telegram-automation-${{ inputs.job }}
  cancel-in-progress: false

jobs:
  academy_realtime_demo:
    if: inputs.job == 'academy-realtime-demo'
    runs-on: ubuntu-latest
    environment: Production
    env:
      TEST_BASE_URL: https://152-32-161-174.sslip.io
    steps:
      - name: Install SSH password helper
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sshpass

      - name: Send only currently eligible realtime products with V4 posters to Academy DEMO
        env:
          SSHPASS: ${{ secrets.YUBIT_SERVER_PASSWORD }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          if [ -z "$SSHPASS" ]; then
            echo "YUBIT_SERVER_PASSWORD is not configured." >&2
            exit 1
          fi
          report_path="$RUNNER_TEMP/academy-realtime-demo.json"
          sshpass -e ssh \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=10 \
            -o StrictHostKeyChecking=accept-new \
            ubuntu@152.32.161.174 \
            "EXPECTED_SHA='$EXPECTED_SHA' TEST_BASE_URL='$TEST_BASE_URL' bash -s" \
            >"$report_path" <<'REMOTE'
          set -Eeuo pipefail
          env_file=/etc/yubit-academy/production.env
          expected_targets='-1003710405969:8,-1003710405969:10,-1003710405969:16'
          report_file="$(sudo --user=ubuntu mktemp)"
          cleanup() { rm -f "$report_file"; }
          trap cleanup EXIT

          release="$(readlink -f /opt/yubit-academy/current)"
          case "$release" in
            /opt/yubit-academy/releases/*) ;;
            *) echo "Current release path is invalid." >&2; exit 1 ;;
          esac
          current_sha="$(tr -d '[:space:]' <"$release/.release-commit")"
          if [ "$current_sha" != "$EXPECTED_SHA" ]; then
            echo "The requested workflow SHA is not the deployed release." >&2
            exit 1
          fi

          read_env() {
            sudo awk -F= -v key="$1" '$1 == key { sub(/^[^=]*=/, ""); print; exit }' "$env_file"
          }
          auth_username="$(read_env AUTH_USERNAME)"
          auth_password="$(read_env AUTH_PASSWORD)"
          obsidian_vault_path="$(read_env OBSIDIAN_VAULT_PATH)"
          if [ -z "$auth_username" ] || [ -z "$auth_password" ] || [ -z "$obsidian_vault_path" ]; then
            echo "Production application credentials or Obsidian vault are unavailable." >&2
            exit 1
          fi
          if [ "$(read_env TELEGRAM_DEMO_ONLY)" != "true" ] \
            || [ "$(read_env TRADING_DEMO_ONLY)" != "true" ] \
            || [ "$(read_env TELEGRAM_DISTRIBUTION_APPROVED_TARGETS)" != "$expected_targets" ] \
            || [ "$(read_env ALLOW_LIVE_TELEGRAM)" != "false" ]; then
            echo "Production Telegram safety policy is not locked." >&2
            exit 1
          fi
          publisher_config_before="$(sudo grep -E '^(TELEGRAM_[^=]*|DISCORD_[^=]*|TRADING_DEMO_ONLY|ALLOW_LIVE_TELEGRAM)=' "$env_file" | sha256sum | awk '{print $1}')"

          set +e
          sudo --user=ubuntu env \
            RELEASE_STAGE=production \
            ALLOW_LIVE_TELEGRAM=true \
            TEST_BASE_URL="$TEST_BASE_URL" \
            TEST_USERNAME="$auth_username" \
            TEST_PASSWORD="$auth_password" \
            OBSIDIAN_VAULT_PATH="$obsidian_vault_path" \
            TEST_REPORT_PATH="$report_file" \
            ACCEPTANCE_QUIET=true \
            /opt/yubit-node/bin/node "$release/scripts/send-academy-realtime-demo.cjs"
          script_status=$?
          set -e

          publisher_config_after="$(sudo grep -E '^(TELEGRAM_[^=]*|DISCORD_[^=]*|TRADING_DEMO_ONLY|ALLOW_LIVE_TELEGRAM)=' "$env_file" | sha256sum | awk '{print $1}')"
          if [ "$publisher_config_after" != "$publisher_config_before" ] \
            || [ "$(read_env ALLOW_LIVE_TELEGRAM)" != "false" ]; then
            echo "Realtime DEMO send changed persistent publisher safety configuration." >&2
            exit 1
          fi
          cat "$report_file"
          exit "$script_status"
          REMOTE
          jq -e '
            .ok == true
            and .operation == "academy-realtime-demo-poster-delivery"
            and .historicalReplay == false
            and .mediaIncluded == true
            and .exactTargets == true
            and (.results | length == 3)
            and all(.results[]; .status == "sent" or .status == "skipped")
            and all((.results[] | select(.status == "sent")); .target.chatId == "-1003710405969" and (.target.threadId == 8 or .target.threadId == 10) and ((.messageIds | length) >= ((.productTypes | length) * 2)))
            and all(.cleanup[]; .deleted == true)
          ' "$report_path" >/dev/null
          echo "### Academy DEMO realtime V4 poster delivery" >>"$GITHUB_STEP_SUMMARY"
          jq -r '"- Release: `\(.release.commitSha)`\n- Sent: `\(.results | map(select(.status == "sent") | .productTypes | join(" + ")) | join(", "))`\n- Skipped: `\(.results | map(select(.status == "skipped") | (.key + " (" + (.skipReason // "unspecified") + ")")) | join(", "))`\n- Media included: `\(.mediaIncluded)`"' "$report_path" >>"$GITHUB_STEP_SUMMARY"

      - name: Upload Academy DEMO realtime delivery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academy-realtime-demo-${{ github.sha }}
          path: ${{ runner.temp }}/academy-realtime-demo.json
          if-no-files-found: error
          retention-days: 30

  academy_audit:
    if: inputs.job == 'academy-audit'
    runs-on: ubuntu-latest
    environment: Production
    env:
      TEST_BASE_URL: https://152-32-161-174.sslip.io
    steps:
      - name: Install SSH password helper
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sshpass

      - name: Read Academy DEMO delivery receipts without sending
        env:
          SSHPASS: ${{ secrets.YUBIT_SERVER_PASSWORD }}
        run: |
          set -Eeuo pipefail
          report_path="$RUNNER_TEMP/academy-demo-audit.json"
          sshpass -e ssh \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=10 \
            -o StrictHostKeyChecking=accept-new \
            ubuntu@152.32.161.174 \
            "TEST_BASE_URL='$TEST_BASE_URL' bash -s" \
            >"$report_path" <<'REMOTE'
          set -Eeuo pipefail
          env_file=/etc/yubit-academy/production.env
          read_env() {
            sudo awk -F= -v key="$1" '$1 == key { sub(/^[^=]*=/, ""); print; exit }' "$env_file"
          }
          release="$(readlink -f /opt/yubit-academy/current)"
          export AUTH_USERNAME="$(read_env AUTH_USERNAME)"
          export AUTH_PASSWORD="$(read_env AUTH_PASSWORD)"
          export OBSIDIAN_VAULT_PATH="$(read_env OBSIDIAN_VAULT_PATH)"
          export RELEASE_SHA="$(tr -d '[:space:]' <"$release/.release-commit")"
          python3 <<'PYTHON'
          import datetime
          import glob
          import http.cookiejar
          import json
          import os
          import re
          import ssl
          import urllib.error
          import urllib.parse
          import urllib.request

          base_url = os.environ["TEST_BASE_URL"]
          cookie_jar = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(
              urllib.request.HTTPCookieProcessor(cookie_jar),
              urllib.request.HTTPSHandler(context=ssl._create_unverified_context()),
          )

          def sanitize_http_error(value):
              sanitized = re.sub(r"postgres(?:ql)?://[^\s\"']+", "postgresql://<redacted>", value, flags=re.I)
              sanitized = re.sub(r'(?i)(\"(?:password|token|secret)\"\s*:\s*)\"[^\"]*\"', r'\1"<redacted>"', sanitized)
              return re.sub(r"\b\d{6,}:[A-Za-z0-9_-]{20,}\b", "<telegram-token-redacted>", sanitized)

          def read_json(request):
              try:
                  with opener.open(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  body = error.read().decode("utf-8", errors="replace")
                  url = request.full_url if isinstance(request, urllib.request.Request) else str(request)
                  endpoint = urllib.parse.urlsplit(url).path
                  if urllib.parse.urlsplit(url).query:
                      endpoint += "?" + urllib.parse.urlsplit(url).query
                  raise RuntimeError(
                      f"{endpoint} failed with HTTP {error.code}: {sanitize_http_error(body[:2000])}"
                  ) from error

          login_request = urllib.request.Request(
              f"{base_url}/api/auth/login",
              data=json.dumps({
                  "username": os.environ["AUTH_USERNAME"],
                  "password": os.environ["AUTH_PASSWORD"],
              }).encode(),
              headers={"content-type": "application/json"},
              method="POST",
          )
          login = read_json(login_request)
          if login.get("ok") is not True:
              raise RuntimeError("login was not accepted")
          deliveries = read_json(f"{base_url}/api/distribution/logs?limit=500")
          overview = read_json(f"{base_url}/api/distribution")
          demo_rule = re.compile(
              r"^academy-(?:demo-showcase|realtime-demo)-(daily|weekly|release)"
              r"(?:-(?:recovery|validation)-[a-z0-9-]+|-[a-z0-9-]+)?-temporary$"
          )
          receipt_fields = [
              "id", "ruleId", "status", "target", "targetMessageId", "targetMessageIds",
              "deliveredAt", "createdAt", "updatedAt", "error",
          ]

          def canonical_payload(path):
              with open(path, encoding="utf-8") as note:
                  markdown = note.read()
              marker = "<!-- yubit-canonical-payload:v1 -->\n\n```json\n"
              start = markdown.rfind(marker)
              if start < 0 or not markdown.endswith("\n```\n"):
                  return None
              return json.loads(markdown[start + len(marker):-5])

          receipt_payloads = []
          distribution_dir = os.path.join(os.environ["OBSIDIAN_VAULT_PATH"], "40 Distribution")
          for path in glob.glob(os.path.join(distribution_dir, "*.md")):
              if os.path.basename(path) == "INDEX.md":
                  continue
              payload = canonical_payload(path)
              if payload and demo_rule.match(payload.get("ruleId", "")):
                  receipt_payloads.append(payload)
          report = {
              "ok": True,
              "readOnly": True,
              "releaseSha": os.environ["RELEASE_SHA"],
              "auditedAt": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "deliveries": [
                  {field: item.get(field) for field in receipt_fields}
                  for item in deliveries.get("items", [])
                  if demo_rule.match(item.get("ruleId", ""))
              ],
              "obsidianReceipts": sorted(receipt_payloads, key=lambda item: item.get("occurredAt", "")),
              "temporaryRules": [
                  {field: rule.get(field) for field in ("id", "enabled", "status")}
                  for rule in overview.get("rules", [])
                  if demo_rule.match(rule.get("id", ""))
              ],
          }
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PYTHON
          REMOTE
          jq -e '.ok == true and .readOnly == true' "$report_path" >/dev/null

      - name: Upload Academy DEMO read-only audit
        uses: actions/upload-artifact@v4
        with:
          name: academy-demo-audit-${{ github.sha }}
          path: ${{ runner.temp }}/academy-demo-audit.json
          if-no-files-found: error
          retention-days: 30

  telegram_house_audit:
    if: inputs.job == 'telegram-house-audit'
    runs-on: ubuntu-latest
    environment: Production
    env:
      TEST_BASE_URL: https://152-32-161-174.sslip.io
      HOUSE_CHAT_ID: "-1001702053978"
    steps:
      - name: Install SSH password helper
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sshpass

      - name: Audit House of Crypto Telegram routing without sending
        env:
          SSHPASS: ${{ secrets.YUBIT_SERVER_PASSWORD }}
        run: |
          set -Eeuo pipefail
          if [ -z "$SSHPASS" ]; then
            echo "YUBIT_SERVER_PASSWORD is not configured." >&2
            exit 1
          fi
          report_path="$RUNNER_TEMP/telegram-house-audit.json"
          sshpass -e ssh \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=10 \
            -o StrictHostKeyChecking=accept-new \
            ubuntu@152.32.161.174 \
            "TEST_BASE_URL='$TEST_BASE_URL' HOUSE_CHAT_ID='$HOUSE_CHAT_ID' bash -s" \
            >"$report_path" <<'REMOTE'
          set -Eeuo pipefail
          env_file=/etc/yubit-academy/production.env
          read_env() {
            sudo awk -F= -v key="$1" '$1 == key { sub(/^[^=]*=/, ""); print; exit }' "$env_file"
          }
          release="$(readlink -f /opt/yubit-academy/current)"
          export AUTH_USERNAME="$(read_env AUTH_USERNAME)"
          export AUTH_PASSWORD="$(read_env AUTH_PASSWORD)"
          export RELEASE_SHA="$(tr -d '[:space:]' <"$release/.release-commit")"
          export DISTRIBUTION_APPROVED_TARGETS="$(read_env TELEGRAM_DISTRIBUTION_APPROVED_TARGETS)"
          export USER_PUBLISHER_TARGETS="$(read_env TELEGRAM_USER_PUBLISHER_TARGETS)"
          python3 <<'PYTHON'
          import datetime
          import http.cookiejar
          import json
          import os
          import re
          import ssl
          import subprocess
          import urllib.error
          import urllib.parse
          import urllib.request

          base_url = os.environ["TEST_BASE_URL"]
          house_chat_id = os.environ["HOUSE_CHAT_ID"]
          cookie_jar = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(
              urllib.request.HTTPCookieProcessor(cookie_jar),
              urllib.request.HTTPSHandler(context=ssl._create_unverified_context()),
          )

          def sanitize(value):
              text = str(value or "")
              text = re.sub(r"postgres(?:ql)?://[^\s\"']+", "postgresql://<redacted>", text, flags=re.I)
              text = re.sub(r"(?i)(password|token|secret)([=:\"'\s]+)[^\s,}\"]+", r"\1\2<redacted>", text)
              return text[:2000]

          def request_json(path, *, payload=None, timeout=90):
              request = urllib.request.Request(
                  f"{base_url}{path}",
                  data=None if payload is None else json.dumps(payload).encode(),
                  headers={} if payload is None else {"content-type": "application/json"},
                  method="GET" if payload is None else "POST",
              )
              try:
                  with opener.open(request, timeout=timeout) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  body = error.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"{path} HTTP {error.code}: {sanitize(body)}") from error

          properties = [
              "ActiveState", "SubState", "UnitFileState", "ExecMainStatus",
              "NRestarts", "ActiveEnterTimestamp", "ExecMainStartTimestamp",
          ]
          worker_show = subprocess.run(
              ["systemctl", "show", "yubit-academy-worker.service", *[f"--property={item}" for item in properties]],
              check=False,
              capture_output=True,
              text=True,
          )
          worker_service = {}
          for line in worker_show.stdout.splitlines():
              if "=" in line:
                  key, value = line.split("=", 1)
                  worker_service[key] = value
          worker_service["commandStatus"] = worker_show.returncode

          journal = subprocess.run(
              [
                  "journalctl", "-u", "yubit-academy-worker.service", "--since", "2026-08-18 00:00:00",
                  "--no-pager", "-o", "cat", "-n", "5000",
              ],
              check=False,
              capture_output=True,
              text=True,
          )
          worker_events = []
          for line in journal.stdout.splitlines():
              if house_chat_id not in line and "TELEGRAM_GROUP_IDENTITY_NOT_AVAILABLE" not in line:
                  continue
              try:
                  event = json.loads(line)
              except Exception:
                  worker_events.append({"message": sanitize(line)})
                  continue
              worker_events.append({
                  "timestamp": event.get("timestamp", ""),
                  "level": event.get("level", ""),
                  "event": event.get("event", ""),
                  "task": event.get("task", ""),
                  "result": event.get("result", {}),
                  "error": sanitize(event.get("error", "")),
              })
          worker_events = worker_events[-100:]

          errors = []
          overview = {}
          delivery_payload = {}
          authorization = {}
          account_dialogs = []
          try:
              login = request_json("/api/auth/login", payload={
                  "username": os.environ["AUTH_USERNAME"],
                  "password": os.environ["AUTH_PASSWORD"],
              })
              if login.get("ok") is not True:
                  raise RuntimeError("login was not accepted")
              overview = request_json("/api/distribution")
              delivery_payload = request_json("/api/distribution/logs?limit=500")
              authorization = request_json("/api/telegram/user-authorization")
              for account in authorization.get("accounts", []):
                  user_id = str(account.get("userId", ""))
                  if not user_id:
                      continue
                  entry = {
                      "userId": user_id,
                      "username": str(account.get("username", "")),
                      "firstName": str(account.get("firstName", "")),
                      "houseVisibleAsWritable": False,
                      "house": None,
                  }
                  try:
                      dialogs = request_json(
                          "/api/telegram/dialogs?userId=" + urllib.parse.quote(user_id),
                          timeout=150,
                      )
                      house = next(
                          (item for item in dialogs.get("groups", []) if str(item.get("id", "")) == house_chat_id),
                          None,
                      )
                      entry["houseVisibleAsWritable"] = house is not None
                      entry["house"] = house
                  except Exception as error:
                      entry["error"] = sanitize(error)
                  account_dialogs.append(entry)
          except Exception as error:
              errors.append(sanitize(error))

          rule_fields = ["id", "name", "contentType", "enabled", "status", "nextRunAt", "lastRunAt", "lastError"]
          distribution_rules = []
          for rule in overview.get("rules", []):
              if not isinstance(rule, dict):
                  continue
              targets = [
                  {
                      "id": str(target.get("id", "")),
                      "chatId": str(target.get("chatId", "")),
                      "threadId": target.get("threadId"),
                      "groupName": str(target.get("groupName", "")),
                      "topicName": str(target.get("topicName", "")),
                      "enabled": target.get("enabled") is not False,
                  }
                  for target in rule.get("targets", [])
                  if isinstance(target, dict) and str(target.get("chatId", "")) == house_chat_id
              ]
              if targets:
                  distribution_rules.append({
                      **{field: rule.get(field) for field in rule_fields},
                      "targets": targets,
                  })

          recent_deliveries = []
          for delivery in delivery_payload.get("items", []):
              if not isinstance(delivery, dict):
                  continue
              target = delivery.get("target", {}) if isinstance(delivery.get("target"), dict) else {}
              if str(target.get("chatId", "")) != house_chat_id:
                  continue
              recent_deliveries.append({
                  "id": str(delivery.get("id", "")),
                  "ruleId": str(delivery.get("ruleId", "")),
                  "status": str(delivery.get("status", "")),
                  "attempts": delivery.get("attempts", 0),
                  "target": {
                      "chatId": house_chat_id,
                      "threadId": target.get("threadId"),
                      "groupName": str(target.get("groupName", "")),
                      "topicName": str(target.get("topicName", "")),
                  },
                  "targetMessageId": str(delivery.get("targetMessageId", "")),
                  "targetMessageIds": [str(value) for value in delivery.get("targetMessageIds", []) if str(value)],
                  "error": sanitize(delivery.get("error", "")),
                  "createdAt": str(delivery.get("createdAt", "")),
                  "updatedAt": str(delivery.get("updatedAt", "")),
                  "deliveredAt": str(delivery.get("deliveredAt", "")),
              })

          approved = [value for value in re.split(r"[\s,;]+", os.environ.get("DISTRIBUTION_APPROVED_TARGETS", "")) if value]
          publisher_targets = [value for value in re.split(r"[\s,;]+", os.environ.get("USER_PUBLISHER_TARGETS", "")) if value]
          report = {
              "ok": not errors,
              "readOnly": True,
              "accountCatalogKey": "telegram-authorized-accounts-v1",
              "auditedAt": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "releaseSha": os.environ.get("RELEASE_SHA", ""),
              "houseChatId": house_chat_id,
              "workerService": worker_service,
              "workerEvents": worker_events,
              "routingPolicy": {
                  "distributionApproved": any(value == house_chat_id or value.startswith(house_chat_id + ":") for value in approved),
                  "userPublisherTarget": house_chat_id in publisher_targets,
              },
              "publisher": authorization.get("publisher", {}),
              "accounts": account_dialogs,
              "distributionRules": distribution_rules,
              "recentDeliveries": recent_deliveries,
              "errors": errors,
          }
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PYTHON
          REMOTE
          jq -e '.ok == true and .readOnly == true and .houseChatId == "-1001702053978"' "$report_path" >/dev/null
          echo "### House of Crypto Telegram read-only audit" >>"$GITHUB_STEP_SUMMARY"
          jq -r '"- Release: `\(.releaseSha)`\n- Accounts checked: `\(.accounts | length)`\n- Writable identities: `\([.accounts[] | select(.houseVisibleAsWritable == true)] | length)`\n- Matching rules: `\(.distributionRules | length)`\n- Matching receipts: `\(.recentDeliveries | length)`\n- Errors: `\(.errors | join("; "))`"' "$report_path" >>"$GITHUB_STEP_SUMMARY"

      - name: Upload House of Crypto Telegram read-only audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-house-audit-${{ github.sha }}
          path: ${{ runner.temp }}/telegram-house-audit.json
          if-no-files-found: error
          retention-days: 30

  discord_audit:
    if: inputs.job == 'discord-audit'
    runs-on: ubuntu-latest
    environment: Production
    env:
      TEST_BASE_URL: https://152-32-161-174.sslip.io
    steps:
      - name: Install SSH password helper
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sshpass

      - name: Audit Discord credentials, gateway, and channel permissions without sending
        env:
          SSHPASS: ${{ secrets.YUBIT_SERVER_PASSWORD }}
        run: |
          set -Eeuo pipefail
          if [ -z "$SSHPASS" ]; then
            echo "YUBIT_SERVER_PASSWORD is not configured." >&2
            exit 1
          fi
          report_path="$RUNNER_TEMP/discord-audit.json"
          sshpass -e ssh \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=10 \
            -o StrictHostKeyChecking=accept-new \
            ubuntu@152.32.161.174 \
            "TEST_BASE_URL='$TEST_BASE_URL' bash -s" \
            >"$report_path" <<'REMOTE'
          set -Eeuo pipefail
          env_file=/etc/yubit-academy/production.env
          read_env() {
            sudo awk -F= -v key="$1" '$1 == key { sub(/^[^=]*=/, ""); print; exit }' "$env_file"
          }
          release="$(readlink -f /opt/yubit-academy/current)"
          export AUTH_USERNAME="$(read_env AUTH_USERNAME)"
          export AUTH_PASSWORD="$(read_env AUTH_PASSWORD)"
          export RELEASE_SHA="$(tr -d '[:space:]' <"$release/.release-commit")"
          export RELEASE_PATH="$release"
          export JSON_STORE_DIRECTORY="$(read_env JSON_STORE_DIRECTORY)"
          python3 <<'PYTHON'
          import datetime
          import http.cookiejar
          import json
          import os
          import re
          import ssl
          import subprocess
          import urllib.error
          import urllib.parse
          import urllib.request

          base_url = os.environ["TEST_BASE_URL"]
          cookie_jar = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(
              urllib.request.HTTPCookieProcessor(cookie_jar),
              urllib.request.HTTPSHandler(context=ssl._create_unverified_context()),
          )

          def sanitize(value):
              text = str(value or "")
              text = re.sub(r"postgres(?:ql)?://[^\s\"']+", "postgresql://<redacted>", text, flags=re.I)
              text = re.sub(r"(?i)(password|token|secret)([=:\"'\s]+)[^\s,}\"]+", r"\1\2<redacted>", text)
              return text[:2000]

          def request_json(path, *, payload=None, timeout=30):
              request = urllib.request.Request(
                  f"{base_url}{path}",
                  data=None if payload is None else json.dumps(payload).encode(),
                  headers={} if payload is None else {"content-type": "application/json"},
                  method="GET" if payload is None else "POST",
              )
              try:
                  with opener.open(request, timeout=timeout) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  body = error.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"{path} HTTP {error.code}: {sanitize(body)}") from error

          properties = [
              "ActiveState", "SubState", "UnitFileState", "ExecMainStatus",
              "NRestarts", "ActiveEnterTimestamp", "ExecMainStartTimestamp",
          ]
          show = subprocess.run(
              ["systemctl", "show", "yubit-academy-discord.service", *[f"--property={item}" for item in properties]],
              check=False,
              capture_output=True,
              text=True,
          )
          service = {}
          for line in show.stdout.splitlines():
              if "=" in line:
                  key, value = line.split("=", 1)
                  service[key] = value
          service["commandStatus"] = show.returncode

          worker_show = subprocess.run(
              ["systemctl", "show", "yubit-academy-worker.service", *[f"--property={item}" for item in properties]],
              check=False,
              capture_output=True,
              text=True,
          )
          worker_service = {}
          for line in worker_show.stdout.splitlines():
              if "=" in line:
                  key, value = line.split("=", 1)
                  worker_service[key] = value
          worker_service["commandStatus"] = worker_show.returncode

          worker_journal = subprocess.run(
              [
                  "journalctl", "-u", "yubit-academy-worker.service", "--since", "2026-08-18 00:00:00",
                  "--no-pager", "-o", "cat", "-n", "5000",
              ],
              check=False,
              capture_output=True,
              text=True,
          )
          distribution_worker_events = []
          for line in worker_journal.stdout.splitlines():
              try:
                  event = json.loads(line)
              except Exception:
                  continue
              if event.get("task") != "distribution":
                  continue
              distribution_worker_events.append({
                  "timestamp": event.get("timestamp", ""),
                  "level": event.get("level", ""),
                  "event": event.get("event", ""),
                  "durationMs": event.get("durationMs", 0),
                  "result": event.get("result", {}),
                  "error": sanitize(event.get("error", "")),
              })
          distribution_worker_events = distribution_worker_events[-100:]

          errors = []
          status = {}
          health = {}
          distribution_overview = {}
          distribution_deliveries = {}
          try:
              login = request_json("/api/auth/login", payload={
                  "username": os.environ["AUTH_USERNAME"],
                  "password": os.environ["AUTH_PASSWORD"],
              })
              if login.get("ok") is not True:
                  raise RuntimeError("login was not accepted")
              status = request_json("/api/discord")
              health_response = request_json("/api/discord", payload={"action": "health-check"})
              health = health_response.get("result", {}).get("health", {})
              distribution_overview = request_json("/api/distribution")
              distribution_deliveries = request_json("/api/distribution/logs?limit=500")
          except Exception as error:
              errors.append(sanitize(error))

          gateway = status.get("gateway", {}) if isinstance(status, dict) else {}
          config = status.get("config", {}) if isinstance(status, dict) else {}
          preview_profile = {}
          poster_fetch_probe = {}
          template_preflight = {}
          try:
              expected_guild_id = "1530060040508149820"
              expected_channel_id = "1531168767374000269"
              preview_payload = request_json("/api/automation-test", payload={
                  "jobId": "crypto-daily",
                  "targets": [{
                      "platform": "discord",
                      "guildId": expected_guild_id,
                      "channelId": expected_channel_id,
                      "groupName": "TheMoonShow VIP Community",
                      "topicName": "market-insights",
                      "enabled": True,
                  }],
                  "textOnly": False,
              })
              preview = preview_payload.get("result", {}).get("preview", {})
              plans = preview.get("deliveryPlans", [])
              steps = plans[0].get("steps", []) if len(plans) == 1 else []
              profiled_steps = []
              poster_url = ""
              for index, step in enumerate(steps):
                  payload = step.get("payload", {})
                  content = str(payload.get("content", ""))
                  image_url = str(payload.get("imageUrl", ""))
                  parsed_image_url = urllib.parse.urlsplit(image_url) if image_url else None
                  if image_url and not poster_url:
                      poster_url = image_url
                  profiled_steps.append({
                      "index": index,
                      "method": step.get("method", ""),
                      "contentCharacters": len(content),
                      "contentUtf16Units": len(content.encode("utf-16-le")) // 2,
                      "contentBytes": len(content.encode("utf-8")),
                      "hasImageUrl": bool(image_url),
                      "imageUrlLength": len(image_url),
                      "imageUrlScheme": parsed_image_url.scheme if parsed_image_url else "",
                      "imageUrlHost": parsed_image_url.netloc if parsed_image_url else "",
                      "imageUrlPath": parsed_image_url.path if parsed_image_url else "",
                  })
              preview_profile = {
                  "ok": preview_payload.get("ok") is True,
                  "publishable": preview.get("publishable") is True,
                  "planCount": len(plans),
                  "steps": profiled_steps,
              }
              preflight_payload = request_json("/api/discord", payload={
                  "action": "template-preflight",
                  "contentType": "crypto-daily",
                  "channelIds": [expected_channel_id],
              }, timeout=60)
              template_preflight = preflight_payload.get("result", {}).get("templatePreflight", {})
              template_preflight["ok"] = preflight_payload.get("ok") is True
              if poster_url:
                  probe = subprocess.run(
                      [
                          "/opt/yubit-node/bin/node",
                          "-e",
                          """
                          (async () => {
                            try {
                              const response = await fetch(process.env.POSTER_PROBE_URL);
                              const body = await response.arrayBuffer();
                              console.log(JSON.stringify({
                                ok: response.ok,
                                status: response.status,
                                contentType: response.headers.get('content-type') || '',
                                bytes: body.byteLength,
                              }));
                            } catch (error) {
                              console.log(JSON.stringify({
                                ok: false,
                                error: {
                                  name: error?.name || '',
                                  message: error?.message || '',
                                  causeName: error?.cause?.name || '',
                                  causeMessage: error?.cause?.message || '',
                                  causeCode: error?.cause?.code || '',
                                },
                              }));
                            }
                          })();
                          """,
                      ],
                      check=False,
                      capture_output=True,
                      text=True,
                      timeout=45,
                      env={**os.environ, "POSTER_PROBE_URL": poster_url},
                  )
                  try:
                      poster_fetch_probe = json.loads(probe.stdout.strip())
                  except Exception:
                      poster_fetch_probe = {
                          "ok": False,
                          "error": {"message": sanitize(probe.stderr or probe.stdout or "Node poster probe returned no result.")},
                      }
          except Exception as error:
              preview_profile = {"auditError": sanitize(error)}
              poster_fetch_probe = {"ok": False, "auditError": sanitize(error)}
              template_preflight = {"ok": False, "auditError": sanitize(error)}
          runtime_directory = os.environ.get("JSON_STORE_DIRECTORY") or os.path.join(os.environ["RELEASE_PATH"], ".runtime")
          latest_demo_attempt = {}
          try:
              with open(os.path.join(runtime_directory, "automation-state.json"), encoding="utf-8") as handle:
                  automation_state = json.load(handle)
              matching_attempts = [
                  value for key, value in automation_state.items()
                  if str(key).startswith("discord-template:crypto-daily:") and isinstance(value, dict)
              ]
              if matching_attempts:
                  attempt = max(matching_attempts, key=lambda value: str(value.get("at", "")))
                  latest_demo_attempt = {
                      "at": attempt.get("at", ""),
                      "status": attempt.get("status", ""),
                      "targetResults": [
                          {
                              "status": item.get("status", ""),
                              "guildId": str(item.get("target", {}).get("guildId", "")),
                              "channelId": str(item.get("target", {}).get("channelId", "")),
                              "messageIds": [str(value) for value in item.get("messageIds", []) if str(value)],
                              "error": sanitize(item.get("error", "")),
                          }
                          for item in attempt.get("targetResults", []) if isinstance(item, dict)
                      ],
                  }
          except Exception as error:
              latest_demo_attempt = {"auditError": sanitize(error)}
          demo_guild_id = str(config.get("demoGuildId", "") or "")
          discovered_guilds = [
              {
                  "id": str(guild.get("id", "")),
                  "name": str(guild.get("name", "")),
                  "owner": guild.get("owner") is True,
                  "configured": str(guild.get("id", "")) in (config.get("guilds", {}) or {}),
                  "isDemoGuild": str(guild.get("id", "")) == demo_guild_id,
              }
              for guild in status.get("guilds", [])
              if isinstance(guild, dict)
          ]
          rule_fields = ["id", "name", "contentType", "enabled", "status", "schedulePreset", "nextRunAt", "leaseUntil", "runOnce"]
          distribution_rules = []
          for rule in distribution_overview.get("rules", []):
              if not isinstance(rule, dict):
                  continue
              targets = []
              for target in rule.get("targets", []):
                  if not isinstance(target, dict) or str(target.get("platform", "")) != "discord":
                      continue
                  targets.append({
                      "platform": "discord",
                      "guildId": str(target.get("guildId", "")),
                      "channelId": str(target.get("channelId", "")),
                      "groupName": str(target.get("groupName", "")),
                      "topicName": str(target.get("topicName", "")),
                      "enabled": target.get("enabled") is not False,
                  })
              if targets:
                  distribution_rules.append({
                      **{field: rule.get(field) for field in rule_fields},
                      "targets": targets,
                  })
          recent_deliveries = []
          for delivery in distribution_deliveries.get("items", []):
              if not isinstance(delivery, dict):
                  continue
              target = delivery.get("target", {}) if isinstance(delivery.get("target"), dict) else {}
              if str(target.get("platform", "")) != "discord":
                  continue
              recent_deliveries.append({
                  "id": str(delivery.get("id", "")),
                  "ruleId": str(delivery.get("ruleId", "")),
                  "status": str(delivery.get("status", "")),
                  "attempts": delivery.get("attempts", 0),
                  "target": {
                      "platform": "discord",
                      "guildId": str(target.get("guildId", "")),
                      "channelId": str(target.get("channelId", "")),
                      "groupName": str(target.get("groupName", "")),
                      "topicName": str(target.get("topicName", "")),
                  },
                  "targetMessageId": str(delivery.get("targetMessageId", "")),
                  "targetMessageIds": [str(value) for value in delivery.get("targetMessageIds", []) if str(value)],
                  "error": sanitize(delivery.get("error", "")),
                  "createdAt": str(delivery.get("createdAt", "")),
                  "updatedAt": str(delivery.get("updatedAt", "")),
                  "deliveredAt": str(delivery.get("deliveredAt", "")),
              })
          guilds = health.get("guilds", []) if isinstance(health, dict) else []
          channel_results = [
              {
                  "guildId": guild.get("guildId", ""),
                  "guildName": guild.get("guildName", ""),
                  "isDemoGuild": str(guild.get("guildId", "") or "") == demo_guild_id,
                  "guildAvailable": guild.get("available") is True,
                  "guildPermissionsOk": guild.get("permissionsOk") is True,
                  "missingGuildPermissions": guild.get("missingPermissions", []),
                  "channelId": channel.get("channelId", ""),
                  "channelName": channel.get("name", ""),
                  "available": channel.get("available") is True,
                  "canView": channel.get("canView") is True,
                  "canSend": channel.get("canSend") is True,
                  "canEmbed": channel.get("canEmbed") is True,
                  "canAttach": channel.get("canAttach") is True,
                  "canReadHistory": channel.get("canReadHistory") is True,
                  "error": sanitize(channel.get("error", "")),
              }
              for guild in guilds
              for channel in guild.get("channels", [])
          ]
          report = {
              "ok": not errors,
              "readOnly": True,
              "auditedAt": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "releaseSha": os.environ.get("RELEASE_SHA", ""),
              "service": service,
              "workerService": worker_service,
              "distributionWorkerEvents": distribution_worker_events,
              "credentials": {
                  "configured": status.get("configured") is True,
                  "publicKeyConfigured": status.get("publicKeyConfigured") is True,
                  "connected": status.get("connected") is True,
                  "error": sanitize(status.get("error", "")),
              },
              "config": {
                  "demoGuildId": demo_guild_id,
                  "syncEnabled": config.get("syncEnabled") is True,
                  "configuredGuildCount": len(config.get("guilds", {}) or {}),
              },
              "bot": status.get("bot"),
              "discoveredGuilds": discovered_guilds,
              "distributionRules": distribution_rules,
              "recentDeliveries": recent_deliveries,
              "gateway": {
                  "state": gateway.get("state", ""),
                  "online": gateway.get("online") is True,
                  "botId": gateway.get("botId", ""),
                  "username": gateway.get("username", ""),
                  "guildCount": gateway.get("guildCount", 0),
                  "lastHeartbeatAt": gateway.get("lastHeartbeatAt", ""),
                  "lastDeliveryAt": gateway.get("lastDeliveryAt", ""),
                  "lastError": sanitize(gateway.get("lastError", "")),
              },
              "latestDemoAttempt": latest_demo_attempt,
              "previewProfile": preview_profile,
              "posterFetchProbe": poster_fetch_probe,
              "templatePreflight": template_preflight,
              "healthSummary": health.get("summary", {}),
              "channels": channel_results,
              "errors": errors,
          }
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PYTHON
          REMOTE
          jq -e '
            .readOnly == true
            and .templatePreflight.ok == true
            and .templatePreflight.guildId == "1530060040508149820"
            and .templatePreflight.channelId == "1531168767374000269"
            and .templatePreflight.poster.contentType == "image/png"
            and .templatePreflight.poster.filename == "market-card.png"
            and .templatePreflight.poster.bytes > 1024
          ' "$report_path" >/dev/null
          echo "### Discord read-only health audit" >>"$GITHUB_STEP_SUMMARY"
          jq -r '"- Service: `\(.service.ActiveState)/\(.service.SubState)`\n- REST connected: `\(.credentials.connected)`\n- Gateway: `\(.gateway.state)` (online: `\(.gateway.online)`)\n- Channels: `\(.healthSummary.sendableChannels // 0)` sendable / `\(.healthSummary.blockedChannels // 0)` blocked\n- Errors: `\(.errors | join("; "))`"' "$report_path" >>"$GITHUB_STEP_SUMMARY"

      - name: Upload Discord read-only audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discord-audit-${{ github.sha }}
          path: ${{ runner.temp }}/discord-audit.json
          if-no-files-found: error
          retention-days: 30

  discord_demo:
    if: inputs.job == 'discord-demo'
    runs-on: ubuntu-latest
    environment: Production
    env:
      TEST_BASE_URL: https://152-32-161-174.sslip.io
      EXPECTED_DEMO_GUILD_ID: "1530060040508149820"
      EXPECTED_DEMO_CHANNEL_ID: "1531168767374000269"
    steps:
      - name: Install SSH password helper
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sshpass

      - name: Preview and publish one governed Daily Market Brief to Discord Demo
        env:
          SSHPASS: ${{ secrets.YUBIT_SERVER_PASSWORD }}
        run: |
          set -Eeuo pipefail
          if [ -z "$SSHPASS" ]; then
            echo "YUBIT_SERVER_PASSWORD is not configured." >&2
            exit 1
          fi
          report_path="$RUNNER_TEMP/discord-demo-delivery.json"
          sshpass -e ssh \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=10 \
            -o StrictHostKeyChecking=accept-new \
            ubuntu@152.32.161.174 \
            "TEST_BASE_URL='$TEST_BASE_URL' EXPECTED_DEMO_GUILD_ID='$EXPECTED_DEMO_GUILD_ID' EXPECTED_DEMO_CHANNEL_ID='$EXPECTED_DEMO_CHANNEL_ID' bash -s" \
            >"$report_path" <<'REMOTE'
          set -Eeuo pipefail
          env_file=/etc/yubit-academy/production.env
          read_env() {
            sudo awk -F= -v key="$1" '$1 == key { sub(/^[^=]*=/, ""); print; exit }' "$env_file"
          }
          export AUTH_USERNAME="$(read_env AUTH_USERNAME)"
          export AUTH_PASSWORD="$(read_env AUTH_PASSWORD)"
          export RELEASE_SHA="$(tr -d '[:space:]' <"$(readlink -f /opt/yubit-academy/current)/.release-commit")"
          python3 <<'PYTHON'
          import datetime
          import http.cookiejar
          import json
          import os
          import ssl
          import urllib.error
          import urllib.request

          base_url = os.environ["TEST_BASE_URL"]
          expected_guild_id = os.environ["EXPECTED_DEMO_GUILD_ID"]
          expected_channel_id = os.environ["EXPECTED_DEMO_CHANNEL_ID"]
          cookie_jar = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(
              urllib.request.HTTPCookieProcessor(cookie_jar),
              urllib.request.HTTPSHandler(context=ssl._create_unverified_context()),
          )

          def request_json(path, *, payload=None, timeout=45):
              request = urllib.request.Request(
                  f"{base_url}{path}",
                  data=None if payload is None else json.dumps(payload).encode(),
                  headers={} if payload is None else {"content-type": "application/json"},
                  method="GET" if payload is None else "POST",
              )
              try:
                  with opener.open(request, timeout=timeout) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  body = error.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"{path} HTTP {error.code}: {body[:1000]}") from error

          login = request_json("/api/auth/login", payload={
              "username": os.environ["AUTH_USERNAME"],
              "password": os.environ["AUTH_PASSWORD"],
          })
          if login.get("ok") is not True:
              raise RuntimeError("Production login was not accepted.")

          status = request_json("/api/discord")
          config = status.get("config", {})
          if status.get("connected") is not True or status.get("gateway", {}).get("online") is not True:
              raise RuntimeError("Discord Bot is not connected and online.")
          if str(config.get("demoGuildId", "")) != expected_guild_id:
              raise RuntimeError("The configured Discord Demo Server changed; refusing to send.")

          health_payload = request_json("/api/discord", payload={"action": "health-check"})
          health = health_payload.get("result", {}).get("health", {})
          matches = [
              (guild, channel)
              for guild in health.get("guilds", [])
              for channel in guild.get("channels", [])
              if str(guild.get("guildId", "")) == expected_guild_id
              and str(channel.get("channelId", "")) == expected_channel_id
          ]
          if len(matches) != 1:
              raise RuntimeError("The approved Discord Demo channel is unavailable.")
          guild, channel = matches[0]
          required = ("available", "permissionsOk", "canView", "canSend", "canEmbed", "canAttach", "canReadHistory")
          if guild.get("available") is not True or guild.get("permissionsOk") is not True:
              raise RuntimeError("The Discord Demo Server did not pass the permission gate.")
          if any(channel.get(key) is not True for key in required):
              raise RuntimeError("The Discord Demo channel did not pass the permission gate.")

          target = {
              "platform": "discord",
              "guildId": expected_guild_id,
              "channelId": expected_channel_id,
              "groupName": guild.get("guildName", ""),
              "topicName": channel.get("name", ""),
              "enabled": True,
          }
          preview_payload = request_json("/api/automation-test", payload={
              "jobId": "crypto-daily",
              "targets": [target],
              "textOnly": False,
          })
          preview = preview_payload.get("result", {}).get("preview", {})
          governance = preview.get("contentGovernance", {})
          plans = preview.get("deliveryPlans", [])
          products = governance.get("products", [])
          poster = preview.get("poster", {})
          visual_template = poster.get("visualTemplate", {})
          if preview_payload.get("ok") is not True or preview.get("publishable") is not True:
              raise RuntimeError(f"Daily Market Brief is not publishable: {preview.get('skipReason', 'unknown reason')}")
          if governance.get("approved") is not True:
              raise RuntimeError(f"Content governance rejected the preview: {governance.get('reason', 'unknown reason')}")
          if not products or any(item.get("status") != "distribution-ready" for item in products):
              raise RuntimeError("The governed content is not distribution-ready in Obsidian.")
          if visual_template.get("id") != "daily-market-brief-v4":
              raise RuntimeError("The preview did not use the approved Daily Market Brief V4 poster.")
          if len(plans) != 1:
              raise RuntimeError("The preview did not resolve to exactly one Discord destination.")
          plan = plans[0]
          plan_target = plan.get("target", {})
          if plan_target.get("platform") != "discord" or str(plan_target.get("guildId", "")) != expected_guild_id or str(plan_target.get("channelId", "")) != expected_channel_id:
              raise RuntimeError("The preview escaped the approved Discord Demo destination.")
          steps = plan.get("steps", [])
          if not steps or any(step.get("method") != "sendMessage" for step in steps):
              raise RuntimeError("The Discord delivery plan is incomplete.")
          first_payload = steps[0].get("payload", {})
          image_url = str(first_payload.get("imageUrl", ""))
          if not image_url or not any(str(step.get("payload", {}).get("content", "")).strip() for step in steps):
              raise RuntimeError("The preview must include both the poster and approved copy.")
          combined_content = "\n".join(str(step.get("payload", {}).get("content", "")) for step in steps)
          if "YUBIT ACADEMY" in combined_content.upper() or "1–7D" in combined_content.upper() or "1-7D" in combined_content.upper():
              raise RuntimeError("The preview contains retired branding or horizon labels.")

          preflight_payload = request_json("/api/discord", payload={
              "action": "template-preflight",
              "contentType": "crypto-daily",
              "channelIds": [expected_channel_id],
          }, timeout=60)
          template_preflight = preflight_payload.get("result", {}).get("templatePreflight", {})
          preflight_poster = template_preflight.get("poster", {})
          if preflight_payload.get("ok") is not True:
              raise RuntimeError(f"The production Discord template preflight failed: {preflight_payload.get('error') or 'unknown error'}")
          if str(template_preflight.get("guildId", "")) != expected_guild_id or str(template_preflight.get("channelId", "")) != expected_channel_id:
              raise RuntimeError("The production Discord template preflight escaped the approved destination.")
          if preflight_poster.get("contentType") != "image/png" or preflight_poster.get("filename") != "market-card.png":
              raise RuntimeError("The production Discord template preflight returned an unexpected poster type.")
          if int(preflight_poster.get("bytes", 0)) < 1024 or int(preflight_poster.get("bytes", 0)) > 5 * 1024 * 1024:
              raise RuntimeError("The production Discord template preflight returned an invalid poster size.")
          if int(preflight_poster.get("urlLength", 0)) <= 2048:
              raise RuntimeError("The production Discord template preflight did not exercise the attachment path.")

          # This is the sole external-send call in this workflow. It is never retried.
          publish_payload = request_json("/api/discord", payload={
              "action": "template-publish",
              "contentType": "crypto-daily",
              "channelIds": [expected_channel_id],
          }, timeout=90)
          published = publish_payload.get("result", {}).get("templatePublish", {})
          results = published.get("results", [])
          if publish_payload.get("ok") is not True or published.get("status") != "success":
              raise RuntimeError(f"Discord publish failed: {publish_payload.get('error') or published.get('message') or 'unknown error'}")
          if published.get("delivered") != 1 or published.get("failed") != 0 or len(results) != 1:
              raise RuntimeError("Discord publish did not produce exactly one successful destination receipt.")
          receipt = results[0]
          if str(receipt.get("guildId", "")) != expected_guild_id or str(receipt.get("channelId", "")) != expected_channel_id or receipt.get("status") != "success":
              raise RuntimeError("Discord returned a receipt for an unexpected destination.")
          message_ids = [str(value) for value in receipt.get("messageIds", []) if str(value)]
          if not message_ids:
              raise RuntimeError("Discord did not return message IDs for the delivered content.")

          report = {
              "ok": True,
              "operation": "discord-demo-daily-market-brief",
              "sentAt": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "releaseSha": os.environ.get("RELEASE_SHA", ""),
              "contentType": "crypto-daily",
              "product": "daily-market-brief",
              "posterTemplate": visual_template.get("id"),
              "contentPolicy": plan.get("contentPolicy"),
              "guild": {"id": expected_guild_id, "name": guild.get("guildName", "")},
              "channel": {"id": expected_channel_id, "name": channel.get("name", "")},
              "messageIds": message_ids,
              "poster": preflight_poster,
              "telegramTouched": False,
          }
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PYTHON
          REMOTE
          jq -e '
            .ok == true
            and .operation == "discord-demo-daily-market-brief"
            and .product == "daily-market-brief"
            and .posterTemplate == "daily-market-brief-v4"
            and .guild.id == "1530060040508149820"
            and .channel.id == "1531168767374000269"
            and (.messageIds | length) > 0
            and .telegramTouched == false
          ' "$report_path" >/dev/null
          echo "### Discord Demo Daily Market Brief" >>"$GITHUB_STEP_SUMMARY"
          jq -r '"- Destination: `\(.guild.name)` / `\(.channel.name)`\n- Product: `\(.product)`\n- Poster: `\(.posterTemplate)` (`\(.poster.bytes)` bytes)\n- Message IDs: `\(.messageIds | join(", "))`\n- Telegram touched: `\(.telegramTouched)`"' "$report_path" >>"$GITHUB_STEP_SUMMARY"

      - name: Upload Discord Demo delivery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discord-demo-delivery-${{ github.sha }}
          path: ${{ runner.temp }}/discord-demo-delivery.json
          if-no-files-found: error
          retention-days: 30

  academy_demo:
    if: inputs.job == 'academy-demo'
    runs-on: ubuntu-latest
    environment: Production
    env:
      TEST_BASE_URL: https://152-32-161-174.sslip.io
    steps:
      - name: Install SSH password helper
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sshpass

      - name: Send all four governed text products to approved Academy DEMO topics
        env:
          SSHPASS: ${{ secrets.YUBIT_SERVER_PASSWORD }}
          EXPECTED_SHA: ${{ github.sha }}
          ACCEPTANCE_BATCH_ID: acceptance-${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          if [ -z "$SSHPASS" ]; then
            echo "YUBIT_SERVER_PASSWORD is not configured." >&2
            exit 1
          fi
          report_path="$RUNNER_TEMP/academy-demo-acceptance.json"
          sshpass -e ssh \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=10 \
            -o StrictHostKeyChecking=accept-new \
            ubuntu@152.32.161.174 \
            "EXPECTED_SHA='$EXPECTED_SHA' TEST_BASE_URL='$TEST_BASE_URL' ACADEMY_DEMO_ACCEPTANCE_BATCH_ID='$ACCEPTANCE_BATCH_ID' bash -s" \
            >"$report_path" <<'REMOTE'
          set -Eeuo pipefail
          env_file=/etc/yubit-academy/production.env
          expected_targets='-1003710405969:8,-1003710405969:10,-1003710405969:16'
          report_file="$(sudo --user=ubuntu mktemp)"
          cleanup() { rm -f "$report_file"; }
          trap cleanup EXIT

          release="$(readlink -f /opt/yubit-academy/current)"
          case "$release" in
            /opt/yubit-academy/releases/*) ;;
            *) echo "Current release path is invalid." >&2; exit 1 ;;
          esac
          current_sha="$(tr -d '[:space:]' <"$release/.release-commit")"
          if [ "$current_sha" != "$EXPECTED_SHA" ]; then
            echo "The requested workflow SHA is not the deployed release." >&2
            exit 1
          fi

          read_env() {
            sudo awk -F= -v key="$1" '$1 == key { sub(/^[^=]*=/, ""); print; exit }' "$env_file"
          }
          auth_username="$(read_env AUTH_USERNAME)"
          auth_password="$(read_env AUTH_PASSWORD)"
          if [ -z "$auth_username" ] || [ -z "$auth_password" ]; then
            echo "Production application credentials are unavailable." >&2
            exit 1
          fi
          if [ "$(read_env TELEGRAM_DEMO_ONLY)" != "true" ] \
            || [ "$(read_env TELEGRAM_DISTRIBUTION_APPROVED_TARGETS)" != "$expected_targets" ] \
            || [ "$(read_env ALLOW_LIVE_TELEGRAM)" != "false" ]; then
            echo "Production Telegram safety policy is not locked." >&2
            exit 1
          fi
          publisher_config_before="$(sudo grep -E '^(TELEGRAM_[^=]*|DISCORD_[^=]*|TRADING_DEMO_ONLY|ALLOW_LIVE_TELEGRAM)=' "$env_file" | sha256sum | awk '{print $1}')"

          sudo --user=ubuntu env \
            RELEASE_STAGE=production \
            ALLOW_LIVE_TELEGRAM=true \
            TEST_BASE_URL="$TEST_BASE_URL" \
            TEST_USERNAME="$auth_username" \
            TEST_PASSWORD="$auth_password" \
            TEST_REPORT_PATH="$report_file" \
            ACCEPTANCE_QUIET=true \
            ACADEMY_DEMO_ACCEPTANCE_BATCH_ID="$ACADEMY_DEMO_ACCEPTANCE_BATCH_ID" \
            /opt/yubit-node/bin/node "$release/scripts/accept-academy-demo-content.cjs"

          publisher_config_after="$(sudo grep -E '^(TELEGRAM_[^=]*|DISCORD_[^=]*|TRADING_DEMO_ONLY|ALLOW_LIVE_TELEGRAM)=' "$env_file" | sha256sum | awk '{print $1}')"
          if [ "$publisher_config_after" != "$publisher_config_before" ] \
            || [ "$(read_env ALLOW_LIVE_TELEGRAM)" != "false" ]; then
            echo "DEMO acceptance changed persistent publisher safety configuration." >&2
            exit 1
          fi
          cat "$report_file"
          REMOTE
          jq -e '
            .ok == true
            and .historicalReplay == true
            and .mediaIncluded == true
            and .visualContract == "telegram-editorial-card-v4"
            and .previewLabel == "DEMO PREVIEW · FORMAT TEST"
            and (.products | length == 4)
            and (.products | map(.product)) == ["daily-market-brief","weekly-catalyst-calendar","data-flash","market-follow-up"]
            and (.executions | length == 3)
            and ([.executions[].messageIds[]] | length == 8)
            and (.mediaPreflight | length == 4)
            and ((.mediaPreflight | map(.url) | unique | length) == 4)
            and ((.mediaPreflight | map(.templateId) | unique | length) == 4)
            and (.mediaPreflight | map({product, templateId})) == [
              {"product":"daily-market-brief","templateId":"daily-market-brief-v4"},
              {"product":"weekly-catalyst-calendar","templateId":"weekly-catalysts-v4"},
              {"product":"data-flash","templateId":"data-flash-v4"},
              {"product":"market-follow-up","templateId":"market-follow-up-v4"}
            ]
            and all(.mediaPreflight[];
              .status == 200
              and (.contentType | startswith("image/png"))
              and .byteLength >= 1024
              and .byteLength <= 5242880
              and .composition == "locked-master-fixed-field-overlay"
              and .version == 4
              and .canvas == {"width":1200,"height":675}
            )
            and all(.previews[]; .publisherNeutral == true and .publicGenericHorizonIncluded == false and .nativeAssetGlyphs == true and (.visualTemplateIds | length) == (.productIds | length))
            and all(.targets[]; .chatId == "-1003710405969" and (.threadId == 8 or .threadId == 10))
            and all(.cleanup[]; .deleted == true)
          ' "$report_path" >/dev/null
          echo "### Academy DEMO four-product poster acceptance" >>"$GITHUB_STEP_SUMMARY"
          jq -r '"- Release: `\(.release.commitSha)`\n- Products: `\(.products | map(.product) | join(", "))`\n- Telegram messages: `\(.executions | map(.messageIds | join(",")) | join(" · "))`\n- Media included: `\(.mediaIncluded)`"' "$report_path" >>"$GITHUB_STEP_SUMMARY"

      - name: Upload Academy DEMO acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academy-demo-acceptance-${{ github.sha }}
          path: ${{ runner.temp }}/academy-demo-acceptance.json
          if-no-files-found: error
          retention-days: 30

