name: Telegram automations

on:
  # The independent production server owns all recurring schedules. Keep
  # these jobs only as an operator-triggered recovery path.
  workflow_dispatch:
    inputs:
      job:
        description: Automation to run
        required: true
        type: choice
        options:
          - academy-realtime-demo
          - academy-demo
          - academy-poster-v6-recovery
          - academy-audit
          - telegram-house-audit
          - telegram-house-probe
          - telegram-house-resend
          - discord-audit
          - discord-demo
          - agents
          - distribution
          - trading

concurrency:
  group: telegram-automation-${{ inputs.job }}
  cancel-in-progress: false

jobs:
  academy_realtime_demo:
    if: inputs.job == 'academy-realtime-demo'
    runs-on: ubuntu-latest
    environment: Production
    env:
      TEST_BASE_URL: https://152-32-161-174.sslip.io
    steps:
      - name: Install SSH password helper
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sshpass

      - name: Send only currently eligible realtime products with V4 posters to Academy DEMO
        env:
          SSHPASS: ${{ secrets.YUBIT_SERVER_PASSWORD }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          if [ -z "$SSHPASS" ]; then
            echo "YUBIT_SERVER_PASSWORD is not configured." >&2
            exit 1
          fi
          report_path="$RUNNER_TEMP/academy-realtime-demo.json"
          sshpass -e ssh \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=10 \
            -o StrictHostKeyChecking=accept-new \
            ubuntu@152.32.161.174 \
            "EXPECTED_SHA='$EXPECTED_SHA' TEST_BASE_URL='$TEST_BASE_URL' bash -s" \
            >"$report_path" <<'REMOTE'
          set -Eeuo pipefail
          env_file=/etc/yubit-academy/production.env
          expected_targets='-1003710405969:8,-1003710405969:10,-1003710405969:16,-1001702053978:309971'
          report_file="$(sudo --user=ubuntu mktemp)"
          cleanup() { rm -f "$report_file"; }
          trap cleanup EXIT

          release="$(readlink -f /opt/yubit-academy/current)"
          case "$release" in
            /opt/yubit-academy/releases/*) ;;
            *) echo "Current release path is invalid." >&2; exit 1 ;;
          esac
          current_sha="$(tr -d '[:space:]' <"$release/.release-commit")"
          if [ "$current_sha" != "$EXPECTED_SHA" ]; then
            echo "The requested workflow SHA is not the deployed release." >&2
            exit 1
          fi

          read_env() {
            sudo awk -F= -v key="$1" '$1 == key { sub(/^[^=]*=/, ""); print; exit }' "$env_file"
          }
          auth_username="$(read_env AUTH_USERNAME)"
          auth_password="$(read_env AUTH_PASSWORD)"
          obsidian_vault_path="$(read_env OBSIDIAN_VAULT_PATH)"
          if [ -z "$auth_username" ] || [ -z "$auth_password" ] || [ -z "$obsidian_vault_path" ]; then
            echo "Production application credentials or Obsidian vault are unavailable." >&2
            exit 1
          fi
          if [ "$(read_env TELEGRAM_DEMO_ONLY)" != "true" ] \
            || [ "$(read_env TRADING_DEMO_ONLY)" != "true" ] \
            || [ "$(read_env TELEGRAM_DISTRIBUTION_APPROVED_TARGETS)" != "$expected_targets" ] \
            || [ "$(read_env ALLOW_LIVE_TELEGRAM)" != "false" ]; then
            echo "Production Telegram safety policy is not locked." >&2
            exit 1
          fi
          publisher_config_before="$(sudo grep -E '^(TELEGRAM_[^=]*|DISCORD_[^=]*|TRADING_DEMO_ONLY|ALLOW_LIVE_TELEGRAM)=' "$env_file" | sha256sum | awk '{print $1}')"

          set +e
          sudo --user=ubuntu env \
            RELEASE_STAGE=production \
            ALLOW_LIVE_TELEGRAM=true \
            TEST_BASE_URL="$TEST_BASE_URL" \
            TEST_USERNAME="$auth_username" \
            TEST_PASSWORD="$auth_password" \
            OBSIDIAN_VAULT_PATH="$obsidian_vault_path" \
            TEST_REPORT_PATH="$report_file" \
            ACCEPTANCE_QUIET=true \
            /opt/yubit-node/bin/node "$release/scripts/send-academy-realtime-demo.cjs"
          script_status=$?
          set -e

          publisher_config_after="$(sudo grep -E '^(TELEGRAM_[^=]*|DISCORD_[^=]*|TRADING_DEMO_ONLY|ALLOW_LIVE_TELEGRAM)=' "$env_file" | sha256sum | awk '{print $1}')"
          if [ "$publisher_config_after" != "$publisher_config_before" ] \
            || [ "$(read_env ALLOW_LIVE_TELEGRAM)" != "false" ]; then
            echo "Realtime DEMO send changed persistent publisher safety configuration." >&2
            exit 1
          fi
          cat "$report_file"
          exit "$script_status"
          REMOTE
          jq -e '
            .ok == true
            and .operation == "academy-realtime-demo-poster-delivery"
            and .historicalReplay == false
            and .mediaIncluded == true
            and .exactTargets == true
            and (.results | length == 3)
            and all(.results[]; .status == "sent" or .status == "skipped")
            and all((.results[] | select(.status == "sent")); .target.chatId == "-1003710405969" and (.target.threadId == 8 or .target.threadId == 10) and ((.messageIds | length) >= ((.productTypes | length) * 2)))
            and all(.cleanup[]; .deleted == true)
          ' "$report_path" >/dev/null
          echo "### Academy DEMO realtime V4 poster delivery" >>"$GITHUB_STEP_SUMMARY"
          jq -r '"- Release: `\(.release.commitSha)`\n- Sent: `\(.results | map(select(.status == "sent") | .productTypes | join(" + ")) | join(", "))`\n- Skipped: `\(.results | map(select(.status == "skipped") | (.key + " (" + (.skipReason // "unspecified") + ")")) | join(", "))`\n- Media included: `\(.mediaIncluded)`"' "$report_path" >>"$GITHUB_STEP_SUMMARY"

      - name: Upload Academy DEMO realtime delivery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academy-realtime-demo-${{ github.sha }}
          path: ${{ runner.temp }}/academy-realtime-demo.json
          if-no-files-found: error
          retention-days: 30

  academy_audit:
    if: inputs.job == 'academy-audit'
    runs-on: ubuntu-latest
    environment: Production
    env:
      TEST_BASE_URL: https://152-32-161-174.sslip.io
    steps:
      - name: Install SSH password helper
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sshpass

      - name: Read Academy DEMO delivery receipts without sending
        env:
          SSHPASS: ${{ secrets.YUBIT_SERVER_PASSWORD }}
        run: |
          set -Eeuo pipefail
          report_path="$RUNNER_TEMP/academy-demo-audit.json"
          sshpass -e ssh \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=10 \
            -o StrictHostKeyChecking=accept-new \
            ubuntu@152.32.161.174 \
            "TEST_BASE_URL='$TEST_BASE_URL' bash -s" \
            >"$report_path" <<'REMOTE'
          set -Eeuo pipefail
          env_file=/etc/yubit-academy/production.env
          read_env() {
            sudo awk -F= -v key="$1" '$1 == key { sub(/^[^=]*=/, ""); print; exit }' "$env_file"
          }
          release="$(readlink -f /opt/yubit-academy/current)"
          export AUTH_USERNAME="$(read_env AUTH_USERNAME)"
          export AUTH_PASSWORD="$(read_env AUTH_PASSWORD)"
          export SPEAKER_BOT_TOKEN="$(read_env SPEAKER_BOT_TOKEN)"
          if [ -z "$SPEAKER_BOT_TOKEN" ]; then
            export SPEAKER_BOT_TOKEN="$(read_env TRADER1_BOT_TOKEN)"
          fi
          export OBSIDIAN_VAULT_PATH="$(read_env OBSIDIAN_VAULT_PATH)"
          export RELEASE_SHA="$(tr -d '[:space:]' <"$release/.release-commit")"
          python3 <<'PYTHON'
          import datetime
          import glob
          import http.cookiejar
          import json
          import os
          import re
          import ssl
          import urllib.error
          import urllib.parse
          import urllib.request

          base_url = os.environ["TEST_BASE_URL"]
          cookie_jar = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(
              urllib.request.HTTPCookieProcessor(cookie_jar),
              urllib.request.HTTPSHandler(context=ssl._create_unverified_context()),
          )

          def sanitize_http_error(value):
              sanitized = re.sub(r"postgres(?:ql)?://[^\s\"']+", "postgresql://<redacted>", value, flags=re.I)
              sanitized = re.sub(r'(?i)(\"(?:password|token|secret)\"\s*:\s*)\"[^\"]*\"', r'\1"<redacted>"', sanitized)
              return re.sub(r"\b\d{6,}:[A-Za-z0-9_-]{20,}\b", "<telegram-token-redacted>", sanitized)

          def read_json(request):
              try:
                  with opener.open(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  body = error.read().decode("utf-8", errors="replace")
                  url = request.full_url if isinstance(request, urllib.request.Request) else str(request)
                  endpoint = urllib.parse.urlsplit(url).path
                  if urllib.parse.urlsplit(url).query:
                      endpoint += "?" + urllib.parse.urlsplit(url).query
                  raise RuntimeError(
                      f"{endpoint} failed with HTTP {error.code}: {sanitize_http_error(body[:2000])}"
                  ) from error

          login_request = urllib.request.Request(
              f"{base_url}/api/auth/login",
              data=json.dumps({
                  "username": os.environ["AUTH_USERNAME"],
                  "password": os.environ["AUTH_PASSWORD"],
              }).encode(),
              headers={"content-type": "application/json"},
              method="POST",
          )
          login = read_json(login_request)
          if login.get("ok") is not True:
              raise RuntimeError("login was not accepted")
          deliveries = read_json(f"{base_url}/api/distribution/logs?limit=500")
          overview = read_json(f"{base_url}/api/distribution")
          demo_rule = re.compile(
              r"^academy-(?:demo-showcase|realtime-demo)-(daily|weekly|release)"
              r"(?:-(?:recovery|validation)-[a-z0-9-]+|-[a-z0-9-]+)?-temporary$"
          )
          receipt_fields = [
              "id", "ruleId", "status", "target", "targetMessageId", "targetMessageIds",
              "deliveredAt", "createdAt", "updatedAt", "error",
          ]

          def canonical_payload(path):
              with open(path, encoding="utf-8") as note:
                  markdown = note.read()
              marker = "<!-- yubit-canonical-payload:v1 -->\n\n```json\n"
              start = markdown.rfind(marker)
              if start < 0 or not markdown.endswith("\n```\n"):
                  return None
              return json.loads(markdown[start + len(marker):-5])

          receipt_payloads = []
          distribution_dir = os.path.join(os.environ["OBSIDIAN_VAULT_PATH"], "40 Distribution")
          for path in glob.glob(os.path.join(distribution_dir, "*.md")):
              if os.path.basename(path) == "INDEX.md":
                  continue
              payload = canonical_payload(path)
              if payload and demo_rule.match(payload.get("ruleId", "")):
                  receipt_payloads.append(payload)
          report = {
              "ok": True,
              "readOnly": True,
              "releaseSha": os.environ["RELEASE_SHA"],
              "auditedAt": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "deliveries": [
                  {field: item.get(field) for field in receipt_fields}
                  for item in deliveries.get("items", [])
                  if demo_rule.match(item.get("ruleId", ""))
              ],
              "obsidianReceipts": sorted(receipt_payloads, key=lambda item: item.get("occurredAt", "")),
              "temporaryRules": [
                  {field: rule.get(field) for field in ("id", "enabled", "status")}
                  for rule in overview.get("rules", [])
                  if demo_rule.match(rule.get("id", ""))
              ],
          }
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PYTHON
          REMOTE
          jq -e '.ok == true and .readOnly == true' "$report_path" >/dev/null

      - name: Upload Academy DEMO read-only audit
        uses: actions/upload-artifact@v4
        with:
          name: academy-demo-audit-${{ github.sha }}
          path: ${{ runner.temp }}/academy-demo-audit.json
          if-no-files-found: error
          retention-days: 30

  telegram_house_audit:
    if: inputs.job == 'telegram-house-audit'
    runs-on: ubuntu-latest
    environment: Production
    env:
      TEST_BASE_URL: https://152-32-161-174.sslip.io
      HOUSE_CHAT_ID: "-1001702053978"
    steps:
      - name: Install SSH password helper
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sshpass

      - name: Audit House of Crypto Telegram routing without sending
        env:
          SSHPASS: ${{ secrets.YUBIT_SERVER_PASSWORD }}
        run: |
          set -Eeuo pipefail
          if [ -z "$SSHPASS" ]; then
            echo "YUBIT_SERVER_PASSWORD is not configured." >&2
            exit 1
          fi
          report_path="$RUNNER_TEMP/telegram-house-audit.json"
          sshpass -e ssh \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=10 \
            -o StrictHostKeyChecking=accept-new \
            ubuntu@152.32.161.174 \
            "TEST_BASE_URL='$TEST_BASE_URL' HOUSE_CHAT_ID='$HOUSE_CHAT_ID' bash -s" \
            >"$report_path" <<'REMOTE'
          set -Eeuo pipefail
          env_file=/etc/yubit-academy/production.env
          read_env() {
            sudo awk -F= -v key="$1" '$1 == key { sub(/^[^=]*=/, ""); print; exit }' "$env_file"
          }
          release="$(readlink -f /opt/yubit-academy/current)"
          export AUTH_USERNAME="$(read_env AUTH_USERNAME)"
          export AUTH_PASSWORD="$(read_env AUTH_PASSWORD)"
          export SPEAKER_BOT_TOKEN="$(read_env SPEAKER_BOT_TOKEN)"
          if [ -z "$SPEAKER_BOT_TOKEN" ]; then
            export SPEAKER_BOT_TOKEN="$(read_env TRADER1_BOT_TOKEN)"
          fi
          export RELEASE_SHA="$(tr -d '[:space:]' <"$release/.release-commit")"
          export DISTRIBUTION_APPROVED_TARGETS="$(read_env TELEGRAM_DISTRIBUTION_APPROVED_TARGETS)"
          export USER_PUBLISHER_TARGETS="$(read_env TELEGRAM_USER_PUBLISHER_TARGETS)"
          python3 <<'PYTHON'
          import datetime
          import http.cookiejar
          import json
          import os
          import re
          import ssl
          import subprocess
          import urllib.error
          import urllib.parse
          import urllib.request

          base_url = os.environ["TEST_BASE_URL"]
          house_chat_id = os.environ["HOUSE_CHAT_ID"]
          cookie_jar = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(
              urllib.request.HTTPCookieProcessor(cookie_jar),
              urllib.request.HTTPSHandler(context=ssl._create_unverified_context()),
          )

          def sanitize(value):
              text = str(value or "")
              text = re.sub(r"postgres(?:ql)?://[^\s\"']+", "postgresql://<redacted>", text, flags=re.I)
              text = re.sub(r"(?i)(password|token|secret)([=:\"'\s]+)[^\s,}\"]+", r"\1\2<redacted>", text)
              return text[:2000]

          def request_json(path, *, payload=None, timeout=90):
              request = urllib.request.Request(
                  f"{base_url}{path}",
                  data=None if payload is None else json.dumps(payload).encode(),
                  headers={} if payload is None else {"content-type": "application/json"},
                  method="GET" if payload is None else "POST",
              )
              try:
                  with opener.open(request, timeout=timeout) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  body = error.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"{path} HTTP {error.code}: {sanitize(body)}") from error

          properties = [
              "ActiveState", "SubState", "UnitFileState", "ExecMainStatus",
              "NRestarts", "ActiveEnterTimestamp", "ExecMainStartTimestamp",
          ]
          worker_show = subprocess.run(
              ["systemctl", "show", "yubit-academy-worker.service", *[f"--property={item}" for item in properties]],
              check=False,
              capture_output=True,
              text=True,
          )
          worker_service = {}
          for line in worker_show.stdout.splitlines():
              if "=" in line:
                  key, value = line.split("=", 1)
                  worker_service[key] = value
          worker_service["commandStatus"] = worker_show.returncode

          journal = subprocess.run(
              [
                  "journalctl", "-u", "yubit-academy-worker.service", "--since", "2026-08-18 00:00:00",
                  "--no-pager", "-o", "cat", "-n", "5000",
              ],
              check=False,
              capture_output=True,
              text=True,
          )
          worker_events = []
          for line in journal.stdout.splitlines():
              if house_chat_id not in line and "TELEGRAM_GROUP_IDENTITY_NOT_AVAILABLE" not in line:
                  continue
              try:
                  event = json.loads(line)
              except Exception:
                  worker_events.append({"message": sanitize(line)})
                  continue
              worker_events.append({
                  "timestamp": event.get("timestamp", ""),
                  "level": event.get("level", ""),
                  "event": event.get("event", ""),
                  "task": event.get("task", ""),
                  "result": event.get("result", {}),
                  "error": sanitize(event.get("error", "")),
              })
          worker_events = worker_events[-100:]

          errors = []
          overview = {}
          delivery_payload = {}
          authorization = {}
          account_dialogs = []
          bot_access = {}
          try:
              login = request_json("/api/auth/login", payload={
                  "username": os.environ["AUTH_USERNAME"],
                  "password": os.environ["AUTH_PASSWORD"],
              })
              if login.get("ok") is not True:
                  raise RuntimeError("login was not accepted")
              overview = request_json("/api/distribution")
              delivery_payload = request_json("/api/distribution/logs?limit=500")
              authorization = request_json("/api/telegram/user-authorization")
              for account in authorization.get("accounts", []):
                  user_id = str(account.get("userId", ""))
                  if not user_id:
                      continue
                  entry = {
                      "userId": user_id,
                      "username": str(account.get("username", "")),
                      "firstName": str(account.get("firstName", "")),
                      "houseVisibleAsWritable": False,
                      "house": None,
                  }
                  try:
                      dialogs = request_json(
                          "/api/telegram/dialogs?userId=" + urllib.parse.quote(user_id),
                          timeout=150,
                      )
                      house = next(
                          (item for item in dialogs.get("groups", []) if str(item.get("id", "")) == house_chat_id),
                          None,
                      )
                      entry["houseVisibleAsWritable"] = house is not None
                      entry["house"] = house
                  except Exception as error:
                      entry["error"] = sanitize(error)
                  account_dialogs.append(entry)
          except Exception as error:
              errors.append(sanitize(error))

          def telegram_bot_call(method, payload):
              token = os.environ.get("SPEAKER_BOT_TOKEN", "").strip()
              if not token:
                  raise RuntimeError("SPEAKER_BOT_TOKEN is not configured")
              request = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/{method}",
                  data=urllib.parse.urlencode(payload).encode(),
                  headers={"content-type": "application/x-www-form-urlencoded"},
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  body = json.load(response)
              if body.get("ok") is not True:
                  raise RuntimeError(f"Telegram {method} was not accepted")
              return body.get("result", {})

          try:
              bot = telegram_bot_call("getMe", {})
              chat = telegram_bot_call("getChat", {"chat_id": house_chat_id})
              member = telegram_bot_call("getChatMember", {
                  "chat_id": house_chat_id,
                  "user_id": bot.get("id"),
              })
              bot_access = {
                  "botId": str(bot.get("id", "")),
                  "username": str(bot.get("username", "")),
                  "chatTitle": str(chat.get("title", "")),
                  "chatType": str(chat.get("type", "")),
                  "isForum": chat.get("is_forum") is True,
                  "memberStatus": str(member.get("status", "")),
                  "canPostMessages": member.get("can_post_messages"),
                  "canManageTopics": member.get("can_manage_topics"),
                  "canSend": member.get("status") in ("creator", "administrator", "member")
                      and member.get("is_member", True) is not False,
              }
          except Exception as error:
              bot_access = {"canSend": False, "error": sanitize(error)}

          rule_fields = ["id", "name", "contentType", "enabled", "status", "nextRunAt", "lastRunAt", "lastError"]
          distribution_rules = []
          for rule in overview.get("rules", []):
              if not isinstance(rule, dict):
                  continue
              targets = [
                  {
                      "id": str(target.get("id", "")),
                      "chatId": str(target.get("chatId", "")),
                      "threadId": target.get("threadId"),
                      "groupName": str(target.get("groupName", "")),
                      "topicName": str(target.get("topicName", "")),
                      "enabled": target.get("enabled") is not False,
                  }
                  for target in rule.get("targets", [])
                  if isinstance(target, dict) and str(target.get("chatId", "")) == house_chat_id
              ]
              if targets:
                  distribution_rules.append({
                      **{field: rule.get(field) for field in rule_fields},
                      "targets": targets,
                  })

          recent_deliveries = []
          for delivery in delivery_payload.get("items", []):
              if not isinstance(delivery, dict):
                  continue
              target = delivery.get("target", {}) if isinstance(delivery.get("target"), dict) else {}
              if str(target.get("chatId", "")) != house_chat_id:
                  continue
              recent_deliveries.append({
                  "id": str(delivery.get("id", "")),
                  "ruleId": str(delivery.get("ruleId", "")),
                  "status": str(delivery.get("status", "")),
                  "attempts": delivery.get("attempts", 0),
                  "target": {
                      "chatId": house_chat_id,
                      "threadId": target.get("threadId"),
                      "groupName": str(target.get("groupName", "")),
                      "topicName": str(target.get("topicName", "")),
                  },
                  "targetMessageId": str(delivery.get("targetMessageId", "")),
                  "targetMessageIds": [str(value) for value in delivery.get("targetMessageIds", []) if str(value)],
                  "error": sanitize(delivery.get("error", "")),
                  "createdAt": str(delivery.get("createdAt", "")),
                  "updatedAt": str(delivery.get("updatedAt", "")),
                  "deliveredAt": str(delivery.get("deliveredAt", "")),
              })

          approved = [value for value in re.split(r"[\s,;]+", os.environ.get("DISTRIBUTION_APPROVED_TARGETS", "")) if value]
          publisher_targets = [value for value in re.split(r"[\s,;]+", os.environ.get("USER_PUBLISHER_TARGETS", "")) if value]
          report = {
              "ok": not errors,
              "readOnly": True,
              "accountCatalogKey": "telegram-authorized-accounts-v1",
              "auditedAt": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "releaseSha": os.environ.get("RELEASE_SHA", ""),
              "houseChatId": house_chat_id,
              "workerService": worker_service,
              "workerEvents": worker_events,
              "routingPolicy": {
                  "distributionApproved": any(value == house_chat_id or value.startswith(house_chat_id + ":") for value in approved),
                  "userPublisherTarget": house_chat_id in publisher_targets,
              },
              "publisher": authorization.get("publisher", {}),
              "botAccess": bot_access,
              "accounts": account_dialogs,
              "distributionRules": distribution_rules,
              "recentDeliveries": recent_deliveries,
              "errors": errors,
          }
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PYTHON
          REMOTE
          jq -e '.ok == true and .readOnly == true and .houseChatId == "-1001702053978"' "$report_path" >/dev/null
          echo "### House of Crypto Telegram read-only audit" >>"$GITHUB_STEP_SUMMARY"
          jq -r '"- Release: `\(.releaseSha)`\n- Accounts checked: `\(.accounts | length)`\n- Writable identities: `\([.accounts[] | select(.houseVisibleAsWritable == true)] | length)`\n- Matching rules: `\(.distributionRules | length)`\n- Matching receipts: `\(.recentDeliveries | length)`\n- Errors: `\(.errors | join("; "))`"' "$report_path" >>"$GITHUB_STEP_SUMMARY"

      - name: Upload House of Crypto Telegram read-only audit
        if: always()
