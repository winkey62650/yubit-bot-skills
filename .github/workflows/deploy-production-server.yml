name: Deploy production server

on:
  workflow_dispatch:

concurrency:
  group: yubit-academy-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Check out the requested release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Install SSH password helper
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sshpass

      - name: Install and audit the content product without sending
        env:
          SSHPASS: ${{ secrets.YUBIT_SERVER_PASSWORD }}
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_NO_SEND: "1"
        run: |
          set -Eeuo pipefail
          if [ -z "$SSHPASS" ]; then
            echo "YUBIT_SERVER_PASSWORD is not configured." >&2
            exit 1
          fi
          if ! [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "GitHub target commit is invalid." >&2
            exit 1
          fi
          if [ "$DEPLOY_NO_SEND" != "1" ]; then
            echo "This workflow only permits no-send deployments." >&2
            exit 1
          fi

          archive_path="$RUNNER_TEMP/yubit-academy-$DEPLOY_SHA.tar.gz"
          remote_archive="/tmp/yubit-academy-$DEPLOY_SHA.tar.gz"
          cleanup_local() {
            rm -f "$archive_path"
            sshpass -e ssh \
              -o ConnectTimeout=20 \
              -o ServerAliveInterval=10 \
              -o StrictHostKeyChecking=accept-new \
              ubuntu@152.32.161.174 \
              "rm -f -- '$remote_archive'" >/dev/null 2>&1 || true
          }
          trap cleanup_local EXIT

          tar --exclude=".git" -czf "$archive_path" .
          sshpass -e scp \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=10 \
            -o StrictHostKeyChecking=accept-new \
            "$archive_path" \
            "ubuntu@152.32.161.174:$remote_archive"

          sshpass -e ssh \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=10 \
            -o StrictHostKeyChecking=accept-new \
            ubuntu@152.32.161.174 \
            "DEPLOY_SHA='$DEPLOY_SHA' DEPLOY_NO_SEND='$DEPLOY_NO_SEND' REMOTE_ARCHIVE='$remote_archive' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          env_file=/etc/yubit-academy/production.env
          bootstrap_dir=""
          env_backup=""
          env_rewrite=""
          deployment_committed=0
          cleanup_remote() {
            if [ -n "$env_backup" ] && [ "$deployment_committed" != "1" ]; then
              sudo cp -p "$env_backup" "$env_file" || true
              sudo systemctl restart yubit-academy-web.service || true
              echo "Restored the pre-deployment production policy."
            fi
            if [ -n "$env_rewrite" ]; then sudo rm -f "$env_rewrite" || true; fi
            if [ -n "$env_backup" ]; then sudo rm -f "$env_backup" || true; fi
            if [ -n "$bootstrap_dir" ]; then rm -rf "$bootstrap_dir"; fi
            rm -f "$REMOTE_ARCHIVE"
          }
          trap cleanup_remote EXIT

          expected_targets='-1003710405969:8,-1003710405969:10,-1003710405969:16,-1001702053978:309971'
          if [ ! -f "$env_file" ]; then
            echo "Production environment file is missing." >&2
            exit 1
          fi
          env_backup="$(mktemp)"
          sudo cp -p "$env_file" "$env_backup"
          set_env_value() {
            local key="$1"
            local value="$2"
            env_rewrite="$(sudo mktemp /etc/yubit-academy/production.env.next.XXXXXX)"
            sudo awk -v key="$key" -v value="$value" '
              BEGIN { found = 0 }
              index($0, key "=") == 1 {
                if (!found) print key "=" value
                found = 1
                next
              }
              { print }
              END { if (!found) print key "=" value }
            ' "$env_file" | sudo tee "$env_rewrite" >/dev/null
            sudo chown --reference="$env_file" "$env_rewrite"
            sudo chmod --reference="$env_file" "$env_rewrite"
            sudo mv -f "$env_rewrite" "$env_file"
            env_rewrite=""
          }
          set_env_value TELEGRAM_DEMO_ONLY true
          set_env_value TRADING_DEMO_ONLY true
          set_env_value TELEGRAM_DISTRIBUTION_APPROVED_TARGETS "$expected_targets"
          set_env_value ALLOW_LIVE_TELEGRAM false

          read_env() {
            sudo awk -F= -v key="$1" '$1 == key { sub(/^[^=]*=/, ""); print; exit }' "$env_file"
          }
          if [ "$(read_env TELEGRAM_DEMO_ONLY)" != "true" ]; then
            echo "Production safety gate failed: TELEGRAM_DEMO_ONLY must be true." >&2
            exit 1
          fi
          if [ "$(read_env TRADING_DEMO_ONLY)" != "true" ]; then
            echo "Production safety gate failed: TRADING_DEMO_ONLY must be true." >&2
            exit 1
          fi
          if [ "$(read_env TELEGRAM_DISTRIBUTION_APPROVED_TARGETS)" != "$expected_targets" ]; then
            echo "Production safety gate failed: approved targets must be exactly the governed DEMO and House Topic allowlist." >&2
            exit 1
          fi
          if [ "$(read_env ALLOW_LIVE_TELEGRAM)" = "true" ]; then
            echo "Production safety gate failed: ALLOW_LIVE_TELEGRAM must not be true." >&2
            exit 1
          fi

          publisher_config_before="$(sudo grep -E '^(TELEGRAM_[^=]*|DISCORD_[^=]*|TRADING_DEMO_ONLY|ALLOW_LIVE_TELEGRAM)=' "$env_file" | sha256sum | awk '{print $1}')"
          bootstrap_dir="$(mktemp -d)"
          tar -xzf "$REMOTE_ARCHIVE" -C "$bootstrap_dir"
          rm -f "$REMOTE_ARCHIVE"
          if [ ! -x "$bootstrap_dir/deploy/server/deploy.sh" ]; then
            echo "Uploaded release does not contain the deployment script." >&2
            exit 1
          fi

          DEPLOY_NO_SEND="$DEPLOY_NO_SEND" \
            SOURCE_DIR="$bootstrap_dir" \
            EXPECTED_COMMIT="$DEPLOY_SHA" \
            bash "$bootstrap_dir/deploy/server/deploy.sh"

          publisher_config_after="$(sudo grep -E '^(TELEGRAM_[^=]*|DISCORD_[^=]*|TRADING_DEMO_ONLY|ALLOW_LIVE_TELEGRAM)=' "$env_file" | sha256sum | awk '{print $1}')"
          if [ "$publisher_config_after" != "$publisher_config_before" ]; then
            echo "No-send deployment changed Telegram or Discord configuration." >&2
            exit 1
          fi
          deployment_committed=1
          echo "Governed Telegram production target policy is active."
          REMOTE
