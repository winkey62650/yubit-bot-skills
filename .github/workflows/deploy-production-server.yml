name: Deploy production server

on:
  workflow_dispatch:

concurrency:
  group: yubit-academy-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Install SSH password helper
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sshpass

      - name: Deploy the latest code/academy release
        env:
          SSHPASS: ${{ secrets.YUBIT_SERVER_PASSWORD }}
          DESKTOP_PUBLISHER_SECRET: ${{ secrets.DESKTOP_PUBLISHER_SECRET }}
          DISCORD_APP_ID: ${{ secrets.DISCORD_APP_ID }}
          DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          APPROVED_DISTRIBUTION_TARGETS: ${{ vars.TELEGRAM_DISTRIBUTION_APPROVED_TARGETS }}
        run: |
          if [ -z "$SSHPASS" ]; then
            echo "YUBIT_SERVER_PASSWORD is not configured." >&2
            exit 1
          fi
          if [ -z "$DESKTOP_PUBLISHER_SECRET" ]; then
            echo "DESKTOP_PUBLISHER_SECRET is not configured." >&2
            exit 1
          fi
          if [ -z "$DISCORD_APP_ID" ] || [ -z "$DISCORD_PUBLIC_KEY" ] || [ -z "$DISCORD_BOT_TOKEN" ]; then
            echo "Discord production credentials are not configured." >&2
            exit 1
          fi
          if ! [[ "$APPROVED_DISTRIBUTION_TARGETS" =~ ^-?[0-9]+:([1-9][0-9]*|channel)(,-?[0-9]+:([1-9][0-9]*|channel))*$ ]]; then
            echo "Production distribution target allowlist is missing or invalid." >&2
            exit 1
          fi
          policy_b64="$(printf '%s' "$APPROVED_DISTRIBUTION_TARGETS" | base64 -w0)"
          desktop_secret_b64="$(printf '%s' "$DESKTOP_PUBLISHER_SECRET" | base64 -w0)"
          discord_app_id_b64="$(printf '%s' "$DISCORD_APP_ID" | base64 -w0)"
          discord_public_key_b64="$(printf '%s' "$DISCORD_PUBLIC_KEY" | base64 -w0)"
          discord_bot_token_b64="$(printf '%s' "$DISCORD_BOT_TOKEN" | base64 -w0)"
          sshpass -e ssh \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=10 \
            -o StrictHostKeyChecking=accept-new \
            ubuntu@152.32.161.174 \
            "POLICY_B64='$policy_b64' DESKTOP_SECRET_B64='$desktop_secret_b64' DISCORD_APP_ID_B64='$discord_app_id_b64' DISCORD_PUBLIC_KEY_B64='$discord_public_key_b64' DISCORD_BOT_TOKEN_B64='$discord_bot_token_b64' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          env_file=/etc/yubit-academy/production.env
          approved_targets="$(printf '%s' "$POLICY_B64" | base64 -d)"
          desktop_publisher_secret="$(printf '%s' "$DESKTOP_SECRET_B64" | base64 -d)"
          discord_app_id="$(printf '%s' "$DISCORD_APP_ID_B64" | base64 -d)"
          discord_public_key="$(printf '%s' "$DISCORD_PUBLIC_KEY_B64" | base64 -d)"
          discord_bot_token="$(printf '%s' "$DISCORD_BOT_TOKEN_B64" | base64 -d)"
          session_key="$(sudo awk -F= '$1 == "TELEGRAM_USER_SESSION_ENCRYPTION_KEY" { sub(/^[^=]*=/, ""); print; exit }' "$env_file")"
          if [ -z "$session_key" ]; then
            session_key="$(openssl rand -hex 32)"
          fi
          env_tmp="$(mktemp)"
          sudo awk '!/^(TELEGRAM_DEMO_ONLY|TELEGRAM_DISTRIBUTION_APPROVED_TARGETS|TRADING_DEMO_ONLY|TELEGRAM_PUBLISHER_MODE|TELEGRAM_BOT_PUBLISHER_USERNAME|TELEGRAM_USER_PUBLISHER_REQUIRED|TELEGRAM_USER_PUBLISHER_TARGETS|TELEGRAM_USER_PUBLISHER_USERNAME|TELEGRAM_USER_SESSION_ENCRYPTION_KEY|TELEGRAM_DESKTOP_PUBLISHER_REQUIRED|DESKTOP_PUBLISHER_SECRET|DISCORD_APP_ID|DISCORD_PUBLIC_KEY|DISCORD_BOT_TOKEN)=/' "$env_file" >"$env_tmp"
          {
            printf 'TELEGRAM_DEMO_ONLY=true\n'
            printf 'TELEGRAM_DISTRIBUTION_APPROVED_TARGETS=%s\n' "$approved_targets"
            printf 'TRADING_DEMO_ONLY=true\n'
            printf 'TELEGRAM_PUBLISHER_MODE=user\n'
            printf 'TELEGRAM_USER_PUBLISHER_REQUIRED=true\n'
            printf 'TELEGRAM_USER_PUBLISHER_TARGETS=-1003710405969,-1004378187866,-1003332783916\n'
            printf 'TELEGRAM_USER_PUBLISHER_USERNAME=Serenity_Crypto\n'
            printf 'TELEGRAM_USER_SESSION_ENCRYPTION_KEY=%s\n' "$session_key"
            printf 'TELEGRAM_DESKTOP_PUBLISHER_REQUIRED=true\n'
            printf 'DESKTOP_PUBLISHER_SECRET=%s\n' "$desktop_publisher_secret"
            printf 'DISCORD_APP_ID=%s\n' "$discord_app_id"
            printf 'DISCORD_PUBLIC_KEY=%s\n' "$discord_public_key"
            printf 'DISCORD_BOT_TOKEN=%s\n' "$discord_bot_token"
          } >>"$env_tmp"
          sudo install -m 0600 -o root -g root "$env_tmp" "$env_file"
          rm -f "$env_tmp"
          cd /opt/yubit-academy/current
          bash deploy/server/deploy.sh
          REMOTE
