<main class="p-8">
<h1 class="text-3xl font-black">新群初始化</h1>
<p class="mt-3 text-ops-muted">选择目标群，确认管理机器人已加入并有 Topic 权限后，一键完成群资料、分区、公告和置顶配置。</p>
<section class="mt-6 grid gap-5 xl:grid-cols-[1fr_360px]">
<div class="rounded-lg border border-ops-line bg-white p-6 shadow-ops">
<div class="grid gap-4 md:grid-cols-2">
<label class="grid gap-2 text-sm font-bold text-ops-muted">群名称<input id="groupNameInput" class="min-h-10 rounded-lg border border-ops-line px-3" placeholder="选择群后自动带出，可留空不修改"/>
</label>
<label class="grid gap-2 text-sm font-bold text-ops-muted">管理机器人<select class="min-h-10 rounded-lg border border-ops-line px-3">
<option>YUBITadmin</option>
</select>
</label>
<label class="grid gap-2 text-sm font-bold text-ops-muted">目标群<select id="groupSelect" class="min-h-10 rounded-lg border border-ops-line px-3">
<option value="">正在加载群...</option>
</select>
</label>
<label class="grid gap-2 text-sm font-bold text-ops-muted">分区模板<select class="min-h-10 rounded-lg border border-ops-line px-3">
<option>模版</option>
</select>
</label>
</div>
<div id="selectedGroupHint" class="mt-4 rounded-lg bg-[#fbfcfb] px-4 py-3 text-sm font-bold text-ops-muted">正在读取群配置...</div>
<div class="mt-5 flex flex-wrap gap-3">
<button id="setupBtn" class="rounded-lg bg-ops-accent px-5 py-3 text-sm font-black text-white">批量设置新群</button>
<button id="resetInitializationBtn" class="rounded-lg border border-ops-line bg-white px-5 py-3 text-sm font-black text-ops-ink">重置初始化记录</button>
<button id="reapplyReadFirstBtn" class="rounded-lg border border-ops-accent bg-white px-5 py-3 text-sm font-black text-ops-accent">重新应用 Read First</button>
<button id="cleanupTopicsBtn" class="rounded-lg border border-ops-line bg-white px-5 py-3 text-sm font-black text-ops-ink">清理重复 Topic</button>
<button id="refreshGroupsBtn" class="rounded-lg border border-ops-accent bg-white px-5 py-3 text-sm font-black text-ops-accent">刷新群列表</button>
</div>
<div id="setupStatus" class="mt-3 rounded-lg bg-[#edf7f2] px-3 py-2 text-sm font-bold text-ops-accent hidden">选择群后即可开始初始化。</div>
<div id="setupProgress" class="mt-3 hidden rounded-lg border border-ops-line bg-white p-3">
<div class="flex items-center justify-between text-xs font-black text-ops-muted">
<span id="progressLabel">等待执行</span>
<span id="progressPct">0%</span>
</div>
<div class="mt-2 h-2 overflow-hidden rounded-full bg-[#e7eee9]">
<div id="progressBar" class="h-full w-0 rounded-full bg-ops-accent transition-all duration-700"></div>
</div>
</div>
</div>
<div class="rounded-lg border border-ops-line bg-white p-6 shadow-ops">
<h2 class="text-xl font-black">初始化清单</h2>
<div class="mt-4 grid gap-3 text-sm">
<div class="flex justify-between">
<span>设置群资料</span>
<b class="text-ops-accent">已就绪</b>
</div>
<div class="flex justify-between">
<span>创建分区</span>
<b class="text-ops-accent">已就绪</b>
</div>
<div class="flex justify-between">
<span>设置公告</span>
<b class="text-ops-accent">已就绪</b>
</div>
<div class="flex justify-between">
<span>置顶消息</span>
<b class="text-ops-accent">已就绪</b>
</div>
</div>
</div>
</section>
<section class="mt-5 overflow-hidden rounded-lg border border-ops-line bg-white shadow-ops">
<div class="border-b border-ops-line p-5">
<h2 class="text-xl font-black">分区模板预览</h2>
<p class="mt-1 text-sm text-ops-muted">建群前可以直接修改 Topic 名称和属性；关闭话题表示创建后默认关闭该 Topic。</p>
</div>
<div class="overflow-x-auto">
<table class="w-full min-w-[820px] text-sm">
<thead class="bg-[#f9fbfa] text-left text-xs uppercase text-ops-muted">
<tr>
<th class="px-5 py-3">序号</th>
<th class="px-5 py-3">Emoji</th>
<th class="px-5 py-3">Topic 名称</th>
<th class="px-5 py-3">属性</th>
</tr>
</thead>
<tbody id="topicRows">
</tbody>
</table>
</div>
</section>
</main>
</div>
<script>let knownGroups=[];const topics=[[1,'❗','READ FIRST - DISLAIMER','关闭话题'],[2,'🖼️','Market Events','关闭话题'],[3,'💡','Market Analysis - Crypto/Stocks/TradFi','关闭话题'],[4,'🐲','YUBIT Updates','交流频道'],[6,'💎','Smart Money Tracker','交流频道'],[7,'⚡',"xxx's Trading Zone",'交流频道'],[5,'💰','10k to 100k challenge','交流频道']];document.getElementById('topicRows').innerHTML=topics.map(t=>`<tr class="border-t border-ops-line">
<td class="px-5 py-3 font-bold">${t[0]}</td>
<td class="px-5 py-3">
<input class="min-h-10 w-20 rounded-lg border border-ops-line px-3" value="${t[1]}"/>
</td>
<td class="px-5 py-3">
<input class="min-h-10 w-full rounded-lg border border-ops-line px-3" value="${t[2]}"/>
</td>
<td class="px-5 py-3">
<select class="min-h-10 w-full rounded-lg border border-ops-line px-3">
<option selected>${t[3]}</option>
<option>关闭话题</option>
<option>频道禁言</option>
<option>交流频道</option>
</select>
</td>
</tr>`).join('');

function collectTopics(){const rows=[...document.querySelectorAll('#topicRows tr')];return rows.map((row,index)=>{const inputs=row.querySelectorAll('input');return {id:String(index+1),emoji:inputs[0]?.value||'',name:inputs[1]?.value||'',attribute:row.querySelector('select')?.value||'交流频道'};});}
function selectedGroup(){const chatId=document.getElementById('groupSelect')?.value||'';return knownGroups.find(group=>String(group.chatId)===String(chatId))||null;}
function renderGroups(){const select=document.getElementById('groupSelect');const previous=select.value;select.innerHTML=knownGroups.length?knownGroups.map(group=>`<option value="${escapeHtml(group.chatId)}">${escapeHtml(group.title||group.chatId)}${group.canUseTopics?'':'（未开启 Topic）'}</option>`).join(''):'<option value="">暂无群，请先刷新群配置</option>';if(knownGroups.some(group=>String(group.chatId)===String(previous)))select.value=previous;renderSelectedGroup();}
function renderSelectedGroup(){const group=selectedGroup();const hint=document.getElementById('selectedGroupHint');if(!group){hint.textContent='还没有选择群。请先到群配置刷新，或点击这里的刷新群列表。';updateSetupAvailability(null);return;}const nameInput=document.getElementById('groupNameInput');if(!nameInput.value||nameInput.dataset.autoFilled==='true'){nameInput.value=group.title||'';nameInput.dataset.autoFilled='true';}const initialized=isGroupInitialized(group);hint.textContent=initialized?`已选择：${group.title}。这个群已经完成初始化，不需要重复批量设置。`:group.canUseTopics?`已选择：${group.title}。可以初始化 Topic。`:`已选择：${group.title}。这个群还没开启 Topic，先去 Telegram 群设置里开启 Topics。`;updateSetupAvailability(group);}
async function loadGroups(){const hint=document.getElementById('selectedGroupHint');hint.textContent='正在读取群配置...';try{const response=await fetch('/api/group-config');const data=await response.json();knownGroups=data.groups||[];renderGroups();}catch(error){hint.textContent=`读取群失败：${error.message}`;}}
async function refreshGroups(){const hint=document.getElementById('selectedGroupHint');hint.textContent='正在刷新 Telegram 群列表...';try{const response=await fetch('/api/chats');const data=await response.json();const chats=data.chats||[];await fetch('/api/group-config',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({groups:chats})});knownGroups=chats;renderGroups();hint.textContent=chats.length?`已刷新 ${chats.length} 个群。`:'没有发现群，请确认机器人已加入群并收到过消息。';}catch(error){hint.textContent=`刷新群失败：${error.message}`;}}
function escapeHtml(value){return String(value||'').replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));}
function cleanError(value){return String(value||'操作没有完成，请检查机器人权限、目标群 Topic 设置或网络连接。').split('\n').filter(line=>!line.includes('file://')&&!line.includes('node:')&&!line.includes('Node.js')&&!line.includes('at ')&&!line.includes('triggerUncaughtException')).join(' ').replace(/^(Error:|执行失败：|请求失败：)\s*/,'').trim()||'操作没有完成，请检查机器人权限、目标群 Topic 设置或网络连接。';}
function normalizeTopicName(value){return String(value||'').replace(/^[^\p{L}\p{N}]+/u,'').replace(/\s+/g,' ').trim().toLowerCase();}
function expectedTopicNames(){return new Set(topics.map(topic=>normalizeTopicName(topic[2])));}
function isGroupInitialized(group){if(!group?.canUseTopics)return false;const names=new Set((group.topics||[]).map(topic=>normalizeTopicName(topic.name)));return [...expectedTopicNames()].every(name=>names.has(name));}
function updateSetupAvailability(group){const button=document.getElementById('setupBtn');const el=document.getElementById('setupStatus');if(!button)return;const initialized=isGroupInitialized(group);button.disabled=initialized;button.textContent=initialized?'已完成初始化':'批量设置新群';button.classList.toggle('opacity-60',initialized);button.classList.toggle('cursor-not-allowed',initialized);if(initialized&&el){el.classList.remove('hidden');el.textContent='这个群已经完成初始化。不要重复批量设置；如有重复分区，可使用“清理重复 Topic”。';}}
async function readJsonResponse(response){const text=await response.text();try{return JSON.parse(text);}catch{return {ok:false,error:`服务器返回了非 JSON 响应（HTTP ${response.status}）。请检查服务是否刚刚重启或接口是否超时。`};}}
function startProgress(label){const box=document.getElementById('setupProgress');const bar=document.getElementById('progressBar');const pct=document.getElementById('progressPct');const text=document.getElementById('progressLabel');const buttons=[document.getElementById('setupBtn'),document.getElementById('reapplyReadFirstBtn'),document.getElementById('cleanupTopicsBtn')].filter(Boolean);let value=8;box.classList.remove('hidden');text.textContent=label;bar.style.width=`${value}%`;pct.textContent=`${value}%`;buttons.forEach((button)=>button.disabled=true);buttons.forEach((button)=>button.classList.add('opacity-60','cursor-not-allowed'));const timer=setInterval(()=>{value=Math.min(92,value+Math.max(1,Math.round((92-value)/8)));bar.style.width=`${value}%`;pct.textContent=`${value}%`;},3000);return (ok)=>{clearInterval(timer);value=ok?100:96;bar.style.width=`${value}%`;pct.textContent=`${value}%`;text.textContent=ok?'执行完成':'执行结束，请查看结果';buttons.forEach((button)=>button.disabled=false);buttons.forEach((button)=>button.classList.remove('opacity-60','cursor-not-allowed'));};}

document.getElementById('groupNameInput')?.addEventListener('input',(event)=>{event.target.dataset.autoFilled='false';});
document.getElementById('groupSelect')?.addEventListener('change',renderSelectedGroup);
document.getElementById('refreshGroupsBtn')?.addEventListener('click',refreshGroups);
document.getElementById('resetInitializationBtn')?.addEventListener('click',async()=>{const el=document.getElementById('setupStatus');el.classList.remove('hidden');const group=selectedGroup();if(!group){el.textContent='请先选择群';return;}if(!confirm('仅清除本地初始化记录，不会删除 Telegram 群内容。之后可重新批量初始化。是否继续？'))return;const res=await fetch('/api/scripts',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({scriptId:'resetGroupInitialization',payload:{mode:'production',chatId:group.chatId}})});const data=await readJsonResponse(res);if(data.ok){group.topics=[];renderSelectedGroup();el.textContent='初始化记录已重置。现在可以点击“批量设置新群”。';}else el.textContent=`重置没有完成：${cleanError(data.error||data.stderr)}`;});
document.getElementById('reapplyReadFirstBtn')?.addEventListener('click',async()=>{const el=document.getElementById('setupStatus');el.classList.remove('hidden');const group=selectedGroup();if(!group){el.textContent='请先选择群';return;}if(!confirm('将清除并重新发送 Read First 的置顶消息，不会创建重复 Topic。是否继续？'))return;el.textContent='正在重新应用 Read First...';const stopProgress=startProgress('重新应用 Read First');try{const res=await fetch('/api/scripts',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({scriptId:'reapplyReadFirst',payload:{mode:'production',chatId:group.chatId}})});const data=await readJsonResponse(res);stopProgress(data.ok);el.textContent=data.ok?'Read First 已重新发送并置顶。':`重新应用没有完成：${cleanError(data.error||data.stderr)}`;}catch(error){stopProgress(false);el.textContent=`页面连接失败：${cleanError(error.message)}`;}});
document.getElementById('cleanupTopicsBtn')?.addEventListener('click',async()=>{const el=document.getElementById('setupStatus');el.classList.remove('hidden');const group=selectedGroup();if(!group){el.textContent='请先选择群';return;}el.textContent='正在清理重复 Topic，请不要重复点击...';const stopProgress=startProgress('清理重复 Topic');const topics=collectTopics();const chatId=group.chatId;try{const res=await fetch('/api/scripts',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({scriptId:'cleanupTopics',payload:{mode:'production',chatId,topics,deleteTopics:true}})});const data=await readJsonResponse(res);stopProgress(data.ok);updateSetupAvailability(group);el.textContent=data.ok?'重复 Topic 已清理完成。':`清理没有完成：${cleanError(data.error||data.stderr)}`;}catch(error){stopProgress(false);updateSetupAvailability(group);el.textContent=`页面连接失败：${cleanError(error.message)}`;}});
document.getElementById('setupBtn')?.addEventListener('click',async()=>{const el=document.getElementById('setupStatus');el.classList.remove('hidden');const group=selectedGroup();if(!group){el.textContent='请先选择群';return;}if(isGroupInitialized(group)){el.textContent='这个群已经完成初始化，不需要重复批量设置。';updateSetupAvailability(group);return;}if(!group.canUseTopics){el.textContent='这个群还没开启 Topic。请先去 Telegram 群设置里开启 Topics，再刷新群列表。';return;}el.textContent='正在初始化群和 Topic，请不要重复点击...';const stopProgress=startProgress('初始化群与 Topic');const topics=collectTopics();const groupName=document.getElementById('groupNameInput')?.value?.trim()||'';const chatId=group.chatId;try{const res=await fetch('/api/scripts',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({scriptId:'newGroup',payload:{mode:'production',groupName,chatId,topics}})});const data=await readJsonResponse(res);stopProgress(data.ok);el.textContent=data.ok?'初始化已完成。请到群里检查 Topic、公告和置顶消息。':`初始化没有完成：${cleanError(data.error||data.stderr)}`;}catch(error){stopProgress(false);el.textContent=`页面连接失败：${cleanError(error.message)}`;}});
loadGroups();
</script>
